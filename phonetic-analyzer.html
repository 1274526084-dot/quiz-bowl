<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 音变分析 · Phonetic Analyzer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fdf2f8 0%, #eff6ff 50%, #fdf2f8 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .container {
    background: #fff; border-radius: 20px; padding: 32px;
    max-width: 720px; width: 100%; box-shadow: 0 8px 40px rgba(219,39,119,0.12);
  }
  h1 { color: #2563EB; font-size: 24px; text-align: center; }
  .subtitle { color: #DB2777; font-size: 14px; text-align: center; margin-bottom: 20px; }
  .word-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .word-card {
    background: #f8fafc; border-radius: 14px; padding: 16px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s; text-align: center;
  }
  .word-card:hover { border-color: #2563EB; box-shadow: 0 4px 12px rgba(37,99,235,0.12); }
  .word-card .en { font-size: 22px; font-weight: 700; color: #2563EB; }
  .word-card .ipa { font-size: 15px; color: #DB2777; margin: 4px 0; }
  .word-card .syllable { font-size: 13px; color: #64748B; }
  .detail-panel {
    margin-top: 20px; background: #f8fafc; border-radius: 14px; padding: 20px;
    display: none; border: 2px solid #2563EB;
  }
  .detail-panel.show { display: block; }
  .detail-panel h3 { color: #DB2777; margin-bottom: 10px; }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #64748B; }
  .detail-value { color: #1E293B; font-weight: 600; }
  .detail-value.blue { color: #2563EB; }
  .detail-value.pink { color: #DB2777; }
  .play-btn {
    display: inline-block; padding: 8px 18px; background: #2563EB; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px;
    transition: all 0.15s;
  }
  .play-btn:hover { background: #1D4ED8; }
  .play-btn.playing { background: #DB2777; animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  @media (max-width: 500px) { .word-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>🔊 AI Phonetic Analyzer</h1>
  <p class="subtitle">Click a word to see syllable breakdown & sound change rules · 点击单词查看音变分析</p>

  <div class="word-grid" id="wordGrid"></div>
  <div class="detail-panel" id="detailPanel"></div>
</div>
<script>
const phoneticData = [
  { en:'allowed', ipa:'/əˈlaʊd/', syllables:'al·lowed', stress:'2nd syllable', link:'silent "w" — "ow" → /aʊ/', weak:'"a" → /ə/ (schwa)', tip:'Sounds like "a-loud". "not allowed" links to "no-tallowed"', slug:'' },
  { en:'permitted', ipa:'/pərˈmɪtɪd/', syllables:'per·mit·ted', stress:'2nd syllable', link:'double "t" shortens vowel', weak:'"ed" → /ɪd/', tip:'Quick /ɪ/ sound before double consonant', slug:'' },
  { en:'dress code', ipa:'/dres kəʊd/', syllables:'dress code', stress:'both stressed', link:'s+c consonant blend', weak:'None — both words clear', tip:'Do NOT pause between words — blend "s" into "c"', slug:'dress-code' },
  { en:'dress down', ipa:'/dres daʊn/', syllables:'dress down', stress:'both stressed', link:'elision: "ss+d" merges', weak:'None', tip:'The "ss" at end of dress merges with "d" of down', slug:'dress-down' },
  { en:'attitude', ipa:'/ˈætɪtjuːd/', syllables:'at·ti·tude', stress:'1st syllable', link:'unstressed "i" → /ɪ/', weak:'final "e" is silent', tip:'Mouth opens wide on first syllable', slug:'attitude' },
  { en:'persistence', ipa:'/pərˈsɪstəns/', syllables:'per·sis·tence', stress:'2nd syllable', link:'"r" links to next vowel', weak:'"ence" → /əns/', tip:'Hold the /s/ sound on stressed syllable', slug:'persistence' },
  { en:'cooperate', ipa:'/kəʊˈɒpəreɪt/', syllables:'co·op·er·ate', stress:'2nd syllable', link:'vowel linking: co+op', weak:'"ate" → /eɪt/', tip:'Smooth transition between "o" vowels', slug:'cooperate' },
  { en:'vacancy', ipa:'/ˈveɪkənsi/', syllables:'va·can·cy', stress:'1st syllable', link:'smooth vowel transition', weak:'"a" in 2nd syllable → /ə/', tip:'First syllable sounds like "vay"', slug:'vacancy' },
  { en:'slogan', ipa:'/ˈsləʊɡən/', syllables:'slo·gan', stress:'1st syllable', link:'"s+l" blend at start', weak:'"an" → /ən/', tip:'Start with a clean "sl" consonant cluster', slug:'slogan' },
  { en:'staff', ipa:'/stɑːf/', syllables:'staff', stress:'single syllable', link:'"s+t" consonant cluster', weak:'final "ff" is soft', tip:'Long /ɑː/ vowel — mouth open wide, jaw dropped', slug:'' },
];

function buildGrid() {
  const grid = document.getElementById('wordGrid');
  phoneticData.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = '<div class="en">' + w.en + '</div><div class="ipa">' + w.ipa + '</div><div class="syllable">' + w.syllables + '</div>';
    card.onclick = function() { showDetail(i, card); };
    grid.appendChild(card);
  });
}

function showDetail(i, card) {
  var w = phoneticData[i];
  var panel = document.getElementById('detailPanel');
  panel.className = 'detail-panel show';
  var hasAudio = w.slug !== '';
  var btnLabel = hasAudio ? '🔊 Listen (MP3)' : '🔊 Listen (TTS)';
  panel.innerHTML =
    '<h3>📖 ' + w.en + ' <span style="font-size:16px;color:#64748B;">— ' + w.syllables + '</span></h3>' +
    '<div class="detail-row"><span class="detail-label">IPA</span><span class="detail-value blue">' + w.ipa + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Syllable Count</span><span class="detail-value">' + w.syllables.split('·').length + ' syllables</span></div>' +
    '<div class="detail-row"><span class="detail-label">Primary Stress</span><span class="detail-value pink">' + w.stress + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Linking Feature</span><span class="detail-value">' + w.link + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Weak Form / Reduction</span><span class="detail-value">' + w.weak + '</span></div>' +
    '<div class="detail-row"><span class="detail-label">Pronunciation Tip</span><span class="detail-value blue">' + w.tip + '</span></div>' +
    '<button class="play-btn" id="playBtn" data-slug="' + w.slug + '" data-text="' + w.en + '">' + btnLabel + '</button>' +
    '<p style="font-size:11px;color:#94A3B8;margin-top:8px;">' + (hasAudio ? '*Click to hear native-like pronunciation' : '*Click to hear browser TTS pronunciation') + '</p>';

  document.querySelectorAll('.word-card').forEach(function(c) { c.style.borderColor = 'transparent'; });
  card.style.borderColor = '#2563EB';

  // Attach play handler
  document.getElementById('playBtn').addEventListener('click', function() {
    var btn = this;
    var slug = btn.getAttribute('data-slug');
    var text = btn.getAttribute('data-text');
    speakWord(slug, text, btn);
  });
}

function speakWord(slug, text, btn) {
  if (slug) {
    // Use pre-recorded MP3 audio
    btn.classList.add('playing');
    btn.textContent = '🔊 Playing...';
    var audio = new Audio('audio/' + slug + '.mp3');
    audio.onended = function() {
      btn.classList.remove('playing');
      btn.textContent = '🔊 Listen (MP3)';
    };
    audio.onerror = function() {
      // Fallback to TTS if MP3 fails
      btn.classList.remove('playing');
      speakTTS(text, btn);
    };
    audio.play();
  } else {
    // No MP3 available, use browser TTS
    speakTTS(text, btn);
  }
}

function speakTTS(text, btn) {
  if ('speechSynthesis' in window) {
    btn.classList.add('playing');
    btn.textContent = '🔊 Speaking...';
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
      btn.classList.remove('playing');
      btn.textContent = '🔊 Listen (TTS)';
    };
    u.onerror = function() {
      btn.classList.remove('playing');
      btn.textContent = '🔊 Listen (TTS)';
    };
    speechSynthesis.speak(u);
  } else {
    alert('Browser TTS not supported. Please use Chrome/Edge.');
  }
}

buildGrid();
</script>
</body>
</html>

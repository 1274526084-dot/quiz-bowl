<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>铁路情景英语问答挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #1a2d35;
    min-height: 100vh; color: #fff; display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none;
    position: relative; overflow-x: hidden;
  }

  /* ---- Railway track background ---- */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      /* Horizontal rails */
      repeating-linear-gradient(0deg, transparent, transparent 48px, #ffffff06 48px, #ffffff06 52px),
      /* Vertical sleepers / ties */
      repeating-linear-gradient(90deg, transparent, transparent 38px, #ffffff08 38px, #ffffff08 42px),
      /* Subtle diagonal track lines */
      linear-gradient(175deg, transparent 40%, #ffffff03 40.5%, #ffffff03 41%, transparent 41.5%),
      linear-gradient(5deg, transparent 60%, #ffffff03 60.5%, #ffffff03 61%, transparent 61.5%);
  }

  /* Signal light glow top-left */
  body::after {
    content: "";
    position: fixed; top: -80px; left: -40px; width: 200px; height: 200px;
    background: radial-gradient(circle, #ef444420 0%, transparent 70%);
    pointer-events: none; z-index: 0; animation: signalGlow 3s ease-in-out infinite;
  }
  @keyframes signalGlow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; background: radial-gradient(circle, #4ade8040 0%, transparent 70%); }
  }

  .container { max-width: 720px; margin: 0 auto; padding: 16px; width: 100%; position: relative; z-index: 1; }

  /* ---- Header ---- */
  .header {
    text-align: center; padding: 20px 0 12px; position: relative;
  }
  .header-icons {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 6px;
    font-size: 32px;
  }
  .header-icons span { animation: bounce 2s ease-in-out infinite; }
  .header-icons span:nth-child(2) { animation-delay: 0.3s; }
  .header-icons span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .header h1 {
    font-size: 22px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .sub {
    font-size: 12px; color: #8ab4c8; margin-top: 4px;
  }
  .header .rail-divider {
    width: 60px; height: 3px; margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, #fbbf24, #fbbf24, #fbbf24, transparent);
    border-radius: 2px;
  }

  /* ---- Top bar ---- */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #ffffff12, #ffffff08);
    border: 1px solid #ffffff18; border-radius: 14px;
    padding: 12px 18px; margin-bottom: 12px; gap: 12px;
    position: relative; overflow: hidden;
  }
  /* Rivet corners */
  .top-bar::before, .top-bar::after {
    content: ""; position: absolute; width: 8px; height: 8px;
    background: #ffffff40; border-radius: 50%;
  }
  .top-bar::before { top: 6px; left: 10px; }
  .top-bar::after { bottom: 6px; right: 10px; }

  .top-item { text-align: center; }
  .top-item .val { font-size: 24px; font-weight: 900; }
  .top-item .val.p1 { color: #fbbf24; }
  .top-item .val.p2 { color: #4ade80; }
  .top-item .lbl { font-size: 10px; color: #8ab4c8; letter-spacing: 1px; }

  .progress-wrap { flex: 1; }
  .progress-bar {
    height: 8px; background: #ffffff15; border-radius: 4px; overflow: hidden;
    border: 1px solid #ffffff10;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b);
    border-radius: 4px; transition: width 0.3s;
    position: relative;
  }
  /* Moving shine on progress */
  .progress-fill::after {
    content: ""; position: absolute; right: 0; top: 0; bottom: 0;
    width: 20px; background: linear-gradient(90deg, transparent, #ffffff40);
    animation: progressShine 1s linear infinite;
  }
  @keyframes progressShine {
    0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; }
  }

  /* ---- Timer ---- */
  .timer-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 14px;
  }
  .timer-ring {
    width: 60px; height: 60px; border-radius: 50%;
    border: 3px solid #4ade80;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900; transition: border-color 0.3s;
    background: radial-gradient(circle, #ffffff08, transparent);
    box-shadow: 0 0 16px #4ade8020;
  }
  .timer-ring.warn { border-color: #fbbf24; box-shadow: 0 0 16px #fbbf2420; }
  .timer-ring.danger {
    border-color: #ef4444; box-shadow: 0 0 20px #ef444440;
    animation: pulse 0.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .timer-label {
    font-size: 10px; color: #8ab4c8; letter-spacing: 2px; text-transform: uppercase;
  }

  /* ---- Scene card ---- */
  .scene-card {
    background: linear-gradient(135deg, #1e4a5f 0%, #163d4f 100%);
    border: 1px solid #2d6a80; border-radius: 16px;
    padding: 20px 18px; margin-bottom: 14px; text-align: center;
    position: relative; overflow: hidden;
  }
  /* Rail edge on scene card */
  .scene-card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
  }
  /* Subtle train window pattern */
  .scene-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 50%, #ffffff03 0%, transparent 20%),
      radial-gradient(circle at 50% 50%, #ffffff03 0%, transparent 20%),
      radial-gradient(circle at 85% 50%, #ffffff03 0%, transparent 20%);
    opacity: 0.5;
  }

  .scene-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fbbf2418; color: #fbbf24;
    border: 1px solid #fbbf2433; border-radius: 20px;
    padding: 5px 16px; font-size: 11px; letter-spacing: 2px;
    margin-bottom: 10px; position: relative; z-index: 1;
  }
  .scene-prompt {
    font-size: 16px; color: #e0f0f7; line-height: 1.6;
    position: relative; z-index: 1;
  }
  .scene-context {
    font-size: 15px; color: #fbbf24; margin-top: 8px;
    font-weight: 600; position: relative; z-index: 1;
  }

  /* ---- Options ---- */
  .options-list { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #ffffff0c, #ffffff06);
    border: 2px solid #ffffff18; border-radius: 12px;
    padding: 14px 16px; color: #e0f0f7; font-size: 15px;
    cursor: pointer; transition: all 0.15s; text-align: left;
    -webkit-tap-highlight-color: transparent; position: relative;
  }
  .opt-btn::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 2px; border-radius: 1px; background: #4ade8030;
    transition: background 0.2s;
  }
  .opt-btn:hover { background: #ffffff15; border-color: #4ade8055; }
  .opt-btn:hover::before { background: #4ade8080; }
  .opt-btn:active { transform: scale(0.98); }

  .opt-letter {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #ffffff20, #ffffff10);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; flex-shrink: 0;
    border: 1px solid #ffffff20;
  }
  .opt-btn.correct {
    background: #14532d; border-color: #4ade80; color: #4ade80;
  }
  .opt-btn.correct::before { background: #4ade80; }
  .opt-btn.correct .opt-letter { background: #4ade8025; border-color: #4ade8040; }
  .opt-btn.wrong {
    background: #450a0a; border-color: #ef4444; color: #ef4444;
    animation: shake 0.4s;
  }
  .opt-btn.wrong::before { background: #ef4444; }
  .opt-btn.wrong .opt-letter { background: #ef444425; border-color: #ef444440; }
  .opt-btn.disabled { pointer-events: none; opacity: 0.5; }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);} 40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
  }

  /* Feedback */
  .feedback {
    text-align: center; font-size: 13px; margin-top: 10px;
    min-height: 22px; font-weight: 600; line-height: 1.6;
  }
  .feedback.correct { color: #4ade80; }
  .feedback.wrong { color: #ef4444; }

  /* Result */
  .result-card {
    text-align: center; padding: 28px 20px;
    position: relative;
  }
  .result-card::before {
    content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, #fbbf2415 0%, transparent 70%);
    pointer-events: none;
  }
  .result-emoji { font-size: 64px; margin-bottom: 10px; position: relative; }
  .result-score { font-size: 52px; font-weight: 900; color: #fbbf24; position: relative; }
  .result-note {
    font-size: 14px; color: #8ab4c8; margin: 8px 0 20px;
    line-height: 1.8; position: relative;
  }

  .btn-restart {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #1a2d35; border: none; border-radius: 50px;
    padding: 14px 44px; font-size: 16px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    position: relative; box-shadow: 0 4px 20px #fbbf2430;
    transition: all 0.2s;
  }
  .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 6px 24px #fbbf2440; }
  .btn-restart:active { transform: scale(0.95); }

  .hidden { display: none !important; }

  /* Signal lights decor bottom */
  .signal-row {
    display: flex; justify-content: center; gap: 16px;
    margin-top: 6px; opacity: 0.5;
  }
  .signal-light {
    width: 12px; height: 12px; border-radius: 50%;
    animation: signalBlink 2s ease-in-out infinite;
  }
  .signal-light.r { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation-delay: 0s; }
  .signal-light.y { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation-delay: 0.7s; }
  .signal-light.g { background: #4ade80; box-shadow: 0 0 8px #4ade80; animation-delay: 1.4s; }
  @keyframes signalBlink {
    0%, 40%, 100% { opacity: 0.3; transform: scale(0.8); }
    20% { opacity: 1; transform: scale(1.2); }
  }

  @media (max-width: 500px) {
    .header h1 { font-size: 18px; letter-spacing: 1px; }
    .scene-prompt { font-size: 14px; }
    .scene-context { font-size: 13px; }
    .opt-btn { font-size: 13px; padding: 12px 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-icons">
      <span>🚄</span><span>🚂</span><span>🛤️</span>
    </div>
    <h1>铁路情景英语问答挑战</h1>
    <div class="sub">马东铁项目 · 铁路专业 · 情景交际训练</div>
    <div class="rail-divider"></div>
  </div>

  <!-- Signal lights decor -->
  <div class="signal-row">
    <div class="signal-light r"></div>
    <div class="signal-light y"></div>
    <div class="signal-light g"></div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-item">
      <div class="val p1" id="scoreDisplay">0</div>
      <div class="lbl">得分</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="top-item">
      <div class="val p2" id="qDisplay">1/7</div>
      <div class="lbl">进度</div>
    </div>
  </div>

  <!-- Timer -->
  <div class="timer-row">
    <div class="timer-ring" id="timerRing">20</div>
    <div class="timer-label">SEC</div>
  </div>

  <!-- Question area -->
  <div class="scene-card" id="sceneCard">
    <div class="scene-badge" id="sceneBadge">🚂 列车餐车</div>
    <div class="scene-prompt" id="scenePrompt"></div>
    <div class="scene-context" id="sceneContext"></div>
  </div>

  <div class="options-list" id="optionsList"></div>
  <div class="feedback" id="feedback"></div>

  <!-- Result (hidden) -->
  <div class="result-card hidden" id="resultCard">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-note" id="resultNote"></div>
    <button class="btn-restart" onclick="restartGame()">再来一次</button>
  </div>

  <!-- Track decoration at bottom -->
  <div class="signal-row" style="margin-top:20px;">
    <div class="signal-light r"></div>
    <div class="signal-light y"></div>
    <div class="signal-light g"></div>
  </div>
</div>

<script>
var questions = [
  {
    scene: "🚂 列车餐车",
    prompt: "乘务员微笑着递上菜单，用英语询问：",
    question: "\"What would you like to drink?\"",
    options: ["Thank you.", "Here you go.", "Just water.", "Sounds great."],
    answer: 2,
    explain: "[Just water.] 礼貌简洁地回应饮品询问；A用于致谢，B用于递东西，D用于回应提议。"
  },
  {
    scene: "🚉 车站面试室",
    prompt: "面试官看了看简历，抬头用英语问：",
    question: "\"May I have your name?\"",
    options: ["I'm doing well.", "I'm Jane Smith.", "Take care.", "My pleasure."],
    answer: 1,
    explain: "[I'm Jane Smith.] 直接回答姓名询问；A回答[How are you?]，C是告别语，D回应[Thank you]。"
  },
  {
    scene: "🛤️ 站台服务区",
    prompt: "你帮一位老年旅客提行李后，对方感激地说：",
    question: "\"Thank you so much for your help!\"",
    options: ["No problem.", "It's over there.", "Never mind.", "You're welcome."],
    answer: 3,
    explain: "[You're welcome.] 回应感谢最正式礼貌；A偏随意，B指方向，C用于安慰对方别在意。"
  },
  {
    scene: "🔧 机车检修车间",
    prompt: "新同事第一天上班，好奇地问你：",
    question: "\"How do you get to the locomotive depot every day?\"",
    options: ["It's up to you.", "By subway.", "Not far away.", "After you."],
    answer: 1,
    explain: "[By subway.] 回答交通方式；A表示[你决定]，C是距离模糊回答，D是礼让对方先行。"
  },
  {
    scene: "🛡️ 检修班组休息室",
    prompt: "同事兴奋地跑进来说他通过了机车检修高级考核，你应该说：",
    question: "Your colleague: \"I passed the locomotive maintenance exam!\"",
    options: ["Good luck!", "That's true.", "Well done.", "Sure."],
    answer: 2,
    explain: "[Well done!] 对别人的好成绩表示赞扬；A用于事前祝福，B表示同意观点，D表同意。"
  },
  {
    scene: "🚃 列车车厢",
    prompt: "一位旅客想填写乘车意见表，向你借笔：",
    question: "\"Excuse me, can I borrow your pen?\"",
    options: ["Help yourself.", "Have a good time.", "Sure, here you are.", "Don't mention it."],
    answer: 2,
    explain: "[Sure, here you are.] 借出物品的标准回应；A请对方自便，B祝玩开心，D回应感谢。"
  },
  {
    scene: "🎫 车站售票窗口",
    prompt: "售票员打印好车票后，用英语询问付款方式：",
    question: "\"How would you like to pay?\"",
    options: ["By car.", "This way, please.", "Good idea.", "By credit card."],
    answer: 3,
    explain: "[By credit card.] 回答支付方式；A是交通方式，B用于领路，C是对建议的赞同。"
  }
];

var currentQ = 0;
var score = 0;
var timerLeft = 0;
var timerInterval = null;
var answered = false;

function restartGame() {
  currentQ = 0;
  score = 0;
  answered = false;
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("sceneCard").classList.remove("hidden");
  document.getElementById("optionsList").classList.remove("hidden");
  document.getElementById("feedback").classList.remove("hidden");
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("scoreDisplay").textContent = "0";
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("qDisplay").textContent = "1/7";
  loadQuestion();
}

function loadQuestion() {
  if (currentQ >= questions.length) { endGame(); return; }
  answered = false;
  var q = questions[currentQ];

  document.getElementById("sceneBadge").textContent = q.scene;
  document.getElementById("scenePrompt").textContent = q.prompt;
  document.getElementById("sceneContext").textContent = q.question;
  document.getElementById("qDisplay").textContent = (currentQ + 1) + "/7";
  document.getElementById("progressFill").style.width = (currentQ / questions.length * 100) + "%";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";

  var list = document.getElementById("optionsList");
  list.innerHTML = "";
  var letters = ["A", "B", "C", "D"];
  q.options.forEach(function(text, i) {
    var btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = '<span class="opt-letter">' + letters[i] + '</span> ' + text;
    btn.setAttribute("data-idx", i);
    btn.onclick = function() { selectAnswer(i, btn); };
    list.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  timerLeft = 20;
  updateTimer();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    timerLeft = Math.max(0, timerLeft - 0.1);
    updateTimer();
    if (timerLeft <= 0) { clearInterval(timerInterval); if (!answered) timeUp(); }
  }, 100);
}

function updateTimer() {
  var sec = Math.ceil(timerLeft);
  var ring = document.getElementById("timerRing");
  ring.textContent = sec;
  ring.className = "timer-ring" + (timerLeft <= 4 ? " danger" : timerLeft <= 8 ? " warn" : "");
}

function timeUp() {
  answered = true;
  var q = questions[currentQ];
  var btns = document.querySelectorAll(".opt-btn");
  btns.forEach(function(b) {
    b.classList.add("disabled");
    if (parseInt(b.getAttribute("data-idx")) === q.answer) b.classList.add("correct");
  });
  document.getElementById("feedback").textContent = "⏰ 时间到！正确答案: " + ["A","B","C","D"][q.answer] + ". " + q.explain;
  document.getElementById("feedback").className = "feedback wrong";
  setTimeout(nextQuestion, 2000);
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  var q = questions[currentQ];
  var btns = document.querySelectorAll(".opt-btn");
  btns.forEach(function(b) { b.classList.add("disabled"); });

  var fb = document.getElementById("feedback");

  if (idx === q.answer) {
    var timeBonus = timerLeft > 12 ? 5 : timerLeft > 6 ? 3 : 0;
    score += 10 + timeBonus;
    btn.classList.add("correct");
    fb.textContent = "✅ 正确！+" + (10 + timeBonus) + "分  " + q.explain;
    fb.className = "feedback correct";
    document.getElementById("scoreDisplay").textContent = score;
  } else {
    btn.classList.add("wrong");
    btns.forEach(function(b) {
      if (parseInt(b.getAttribute("data-idx")) === q.answer) b.classList.add("correct");
    });
    fb.textContent = "❌ 正确答案: " + ["A","B","C","D"][q.answer] + ". " + q.explain;
    fb.className = "feedback wrong";
  }

  setTimeout(nextQuestion, 2200);
}

function nextQuestion() { currentQ++; loadQuestion(); }

function endGame() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById("sceneCard").classList.add("hidden");
  document.getElementById("optionsList").classList.add("hidden");
  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("timerRing").textContent = "✓";
  document.getElementById("timerRing").className = "timer-ring";
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("qDisplay").textContent = "7/7";

  var maxScore = 7 * 15;
  var pct = score / maxScore;
  var emoji, note;
  if (pct >= 0.9) { emoji = "🏆"; note = "太棒了！你在铁路情景英语问答中表现出色。"; }
  else if (pct >= 0.7) { emoji = "🥇"; note = "很好！基本掌握了铁路情景交际用语。"; }
  else if (pct >= 0.5) { emoji = "🥈"; note = "还不错，再练练铁路相关情景问答。"; }
  else { emoji = "💪"; note = "需要加油！多复习情景交际英语，下次一定更好。"; }

  note += "\n满分 " + maxScore + " 分 · 每题 10 分基础 + 剩余时间奖励";

  document.getElementById("resultEmoji").textContent = emoji;
  document.getElementById("resultScore").textContent = score + " 分";
  document.getElementById("resultNote").textContent = note;
  document.getElementById("resultCard").classList.remove("hidden");
}

restartGame();
</script>
</body>
</html>

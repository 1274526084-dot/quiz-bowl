<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>铁路场景 · 中文选词挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #f0f2f5;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(139,119,90,0.06) 28px, rgba(139,119,90,0.06) 30px),
      repeating-linear-gradient(90deg, transparent, transparent 58px, rgba(139,119,90,0.04) 58px, rgba(139,119,90,0.04) 60px);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 680px; position: relative; }

  /* Top bar */
  .top-bar {
    background: linear-gradient(135deg, #1a3a5c, #2c5f8a);
    color: #fff;
    border-radius: 16px 16px 0 0;
    padding: 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .top-bar::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #fbbf24, #ef4444, #4ade80);
  }
  .top-bar .rivet {
    position: absolute; width: 10px; height: 10px; background: #94a3b8;
    border-radius: 50%; border: 2px solid #cbd5e1;
  }
  .top-bar .rivet.tl { top: 10px; left: 10px; }
  .top-bar .rivet.tr { top: 10px; right: 10px; }
  .top-bar .rivet.bl { bottom: 10px; left: 10px; }
  .top-bar .rivet.br { bottom: 10px; right: 10px; }
  .top-bar .icons { font-size: 28px; letter-spacing: 6px; margin-bottom: 6px; animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  .top-bar h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .top-bar .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .rail-divider { height: 4px; background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706); }

  /* Progress */
  .progress-wrap {
    background: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #e2e8f0;
  }
  .progress-wrap .bar {
    flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;
  }
  .progress-wrap .bar .fill {
    height: 100%; background: linear-gradient(90deg, #2c5f8a, #4ade80);
    border-radius: 4px; transition: width 0.4s;
  }
  .progress-wrap .info { font-size: 14px; color: #64748b; white-space: nowrap; }
  .progress-wrap .word-badge {
    background: #fef3c7; color: #92400e; font-size: 14px; font-weight: 600;
    padding: 3px 12px; border-radius: 12px; white-space: nowrap;
  }

  /* Timer ring */
  .timer-ring {
    width: 44px; height: 44px; border-radius: 50%; border: 4px solid #e2e8f0;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 16px; color: #2c5f8a; flex-shrink: 0; position: relative;
  }
  .timer-ring.warn { border-color: #fbbf24; color: #b45309; animation: pulse 0.6s ease-in-out infinite; }
  .timer-ring.danger { border-color: #ef4444; color: #dc2626; animation: pulse 0.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.1); } }

  /* Scene card */
  .scene-card {
    background: #fff; border-left: 5px solid #2c5f8a;
    padding: 14px 20px; margin: 0 24px; font-size: 15px; color: #475569;
    display: flex; align-items: center; gap: 10px;
  }
  .scene-card .emoji { font-size: 32px; flex-shrink: 0; }
  .scene-card .ctx { font-size: 13px; color: #94a3b8; margin-top: 2px; }

  /* Main card */
  .main-card { background: #fff; padding: 24px 24px 28px; margin: 0 24px; }

  .q-label {
    display: inline-block; background: #2c5f8a; color: #fff;
    font-size: 12px; font-weight: 700; padding: 4px 14px; border-radius: 12px;
    margin-bottom: 16px; letter-spacing: 1px;
  }

  /* Sentence display */
  .sentence-box {
    background: #f0f6ff; border-left: 4px solid #2c5f8a; border-radius: 8px;
    padding: 18px 20px; margin-bottom: 6px;
  }
  .sentence-box .label { font-size: 11px; color: #2c5f8a; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .sentence-box .text { font-size: 21px; line-height: 1.7; color: #1e293b; letter-spacing: 1px; }
  .sentence-box .text .hl {
    background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 4px;
    font-weight: 700; border-bottom: 2px solid #f59e0b;
  }
  .sentence-box .pinyin-row { font-size: 12px; color: #94a3b8; margin-top: 6px; }

  /* Question display */
  .question-box {
    background: #fff; border: 2px dashed #e2e8f0; border-radius: 10px;
    padding: 16px 20px; margin-bottom: 12px; text-align: center;
  }
  .question-box .icon { font-size: 20px; margin-bottom: 4px; }
  .question-box .text { font-size: 18px; font-weight: 600; color: #1e293b; }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .opt-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 12px;
    background: #fff; cursor: pointer; transition: all 0.2s;
    font-size: 18px; font-family: inherit; text-align: left;
  }
  .opt-btn:hover { border-color: #2c5f8a; background: #f0f6ff; }
  .opt-btn .letter {
    width: 34px; height: 34px; border-radius: 50%; background: #f1f5f9;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #64748b; flex-shrink: 0;
  }
  .opt-btn .word { font-size: 20px; font-weight: 600; color: #1e293b; }

  .opt-btn.correct { border-color: #4ade80; background: #f0fdf4; }
  .opt-btn.correct .letter { background: #4ade80; color: #fff; }
  .opt-btn.wrong { border-color: #ef4444; background: #fef2f2; }
  .opt-btn.wrong .letter { background: #ef4444; color: #fff; }
  .opt-btn.show-correct { border-color: #4ade80; background: #f0fdf4; }
  .opt-btn.show-correct .letter { background: #4ade80; color: #fff; }
  .opt-btn:disabled { pointer-events: none; }

  /* Feedback */
  .feedback {
    text-align: center; padding: 12px; font-size: 16px; font-weight: 600;
    min-height: 44px; line-height: 1.6;
  }
  .feedback.ok { color: #16a34a; }
  .feedback.no { color: #dc2626; }

  /* Next button */
  .next-btn {
    display: none; margin: 0 auto 10px; padding: 10px 40px;
    background: #2c5f8a; color: #fff; border: none; border-radius: 24px;
    font-size: 16px; cursor: pointer; font-family: inherit; letter-spacing: 1px;
  }
  .next-btn:hover { background: #1a3a5c; }

  /* Signal row */
  .signal-row { display: flex; justify-content: center; gap: 10px; padding: 10px 0 6px; }
  .signal-light { width: 14px; height: 14px; border-radius: 50%; }
  .signal-light.r { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: blink 2s infinite; }
  .signal-light.y { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: blink 2s infinite 0.7s; }
  .signal-light.g { background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: blink 2s infinite 1.4s; }
  @keyframes blink { 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  /* Result overlay */
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .overlay .result-card {
    background: #fff; border-radius: 20px; padding: 36px 32px; text-align: center;
    max-width: 420px; width: 90%;
  }
  .overlay .result-card .big-emoji { font-size: 56px; margin-bottom: 10px; }
  .overlay .result-card h2 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
  .overlay .result-card .score { font-size: 48px; font-weight: 800; color: #2c5f8a; }
  .overlay .result-card .stats { font-size: 14px; color: #64748b; margin: 8px 0 16px; }
  .overlay .result-card .words-review {
    text-align: left; font-size: 14px; color: #64748b; margin: 10px 0;
    max-height: 150px; overflow-y: auto; line-height: 1.8;
  }
  .overlay .result-card .words-review span { margin: 0 4px; }
  .overlay .result-card .words-review .right { color: #16a34a; }
  .overlay .result-card .words-review .wrong { color: #dc2626; text-decoration: line-through; }
  .overlay .result-card button {
    padding: 12px 36px; background: #2c5f8a; color: #fff; border: none;
    border-radius: 24px; font-size: 17px; cursor: pointer; font-family: inherit;
    margin-top: 10px;
  }
  .overlay .result-card button:hover { background: #1a3a5c; }

  .hidden { display: none !important; }

  /* Bottom rail */
  .bottom-rail {
    height: 6px; background: repeating-linear-gradient(90deg, #8b775a 0, #8b775a 40px, #c4a97d 40px, #c4a97d 42px);
    border-radius: 0 0 16px 16px;
  }

  @media (max-width: 500px) {
    .top-bar h1 { font-size: 18px; }
    .sentence-box .text { font-size: 18px; }
    .opt-btn .word { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="rivet tl"></div><div class="rivet tr"></div>
    <div class="rivet bl"></div><div class="rivet br"></div>
    <div class="icons">🚄 🚂 🛤️</div>
    <h1>铁路场景 · 中文选词挑战</h1>
    <div class="sub">马东铁 · 基础中文 · 读句子选答案</div>
  </div>
  <div class="rail-divider"></div>

  <!-- Progress -->
  <div class="progress-wrap">
    <span class="word-badge" id="wordBadge">📝 旅游</span>
    <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    <div class="timer-ring" id="timerRing">25</div>
    <span class="info" id="qInfo">1/12</span>
  </div>

  <!-- Scene -->
  <div class="scene-card" id="sceneCard">
    <span class="emoji">🚉</span>
    <div><div id="sceneTitle">在火车站售票处</div><div class="ctx" id="sceneCtx">At the railway station ticket office</div></div>
  </div>

  <!-- Main card -->
  <div class="main-card">
    <div class="q-label">📖 读句子 → 🤔 选答案</div>

    <!-- Sentence -->
    <div class="sentence-box">
      <div class="label">📝 读一读 Read:</div>
      <div class="text" id="sentenceText"></div>
      <div class="pinyin-row" id="pinyinRow"></div>
    </div>

    <!-- Question -->
    <div class="question-box">
      <div class="icon">❓</div>
      <div class="text" id="questionText"></div>
    </div>

    <!-- Options -->
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
  </div>

  <div class="signal-row">
    <div class="signal-light r"></div>
    <div class="signal-light y"></div>
    <div class="signal-light g"></div>
  </div>
  <div class="bottom-rail"></div>
</div>

<!-- Result overlay -->
<div class="overlay hidden" id="resultOverlay">
  <div class="result-card">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">太棒了！</h2>
    <div class="score" id="resultScore">0</div>
    <div style="color:#64748b;font-size:15px;">总分</div>
    <div class="stats" id="resultStats"></div>
    <div class="words-review" id="wordsReview"></div>
    <button onclick="restart()">再来一次 🔄</button>
  </div>
</div>

<script>
// ========== 题库：12 道铁路场景选择题 ==========
// 每题：一句含目标词的铁路场景句 + 一个理解问题 + 3 个选项
const questions = [
  {
    id: 1,
    word: "旅游",
    pinyin: "lǚyóu",
    meaning: "travel",
    scene: "在火车站售票处",
    sceneEn: "At the railway station ticket office",
    sceneEmoji: "🚉",
    sentence: '我们坐火车去北京<span class="hl">旅游</span>。',
    sentencePinyin: "Wǒmen zuò huǒchē qù Běijīng lǚyóu.",
    question: "他们去北京做什么？",
    options: [
      { text: "旅游", correct: true },
      { text: "吃饭", correct: false },
      { text: "睡觉", correct: false }
    ],
    explainOk: '✅ 正确！"旅游"就是 travel。坐火车去北京旅游。',
    explainNo: '❌ 应该是"旅游"。句子说"去北京旅游"，不是吃饭或睡觉。'
  },
  {
    id: 2,
    word: "觉得",
    pinyin: "juéde",
    meaning: "think / feel",
    scene: "在列车车厢里",
    sceneEn: "Inside the train carriage",
    sceneEmoji: "🚃",
    sentence: '我<span class="hl">觉得</span>火车很快，也很舒服。',
    sentencePinyin: "Wǒ juéde huǒchē hěn kuài, yě hěn shūfu.",
    question: '"我"认为火车怎么样？',
    options: [
      { text: "又快又舒服", correct: true },
      { text: "又慢又不舒服", correct: false },
      { text: "又大又贵", correct: false }
    ],
    explainOk: '✅ 正确！"觉得"就是 think/feel。我觉得火车又快又舒服。',
    explainNo: '❌ 应该是"又快又舒服"。句子说"很快，也很舒服"。'
  },
  {
    id: 3,
    word: "最",
    pinyin: "zuì",
    meaning: "most",
    scene: "在高铁站台上",
    sceneEn: "On the high-speed rail platform",
    sceneEmoji: "🚄",
    sentence: '高铁是我<span class="hl">最</span>喜欢的交通工具。',
    sentencePinyin: "Gāotiě shì wǒ zuì xǐhuan de jiāotōng gōngjù.",
    question: '"我"喜欢高铁吗？',
    options: [
      { text: "最喜欢", correct: true },
      { text: "不喜欢", correct: false },
      { text: "有一点喜欢", correct: false }
    ],
    explainOk: '✅ 正确！"最"就是 most。"最喜欢"= like the most。',
    explainNo: '❌ 应该是"最喜欢"。"最"表示第一，不是不喜欢。'
  },
  {
    id: 4,
    word: "为什么",
    pinyin: "wèishénme",
    meaning: "why",
    scene: "在站台上",
    sceneEn: "On the platform",
    sceneEmoji: "🚏",
    sentence: '<span class="hl">为什么</span>火车停在这里？因为要等乘客上车。',
    sentencePinyin: "Wèishénme huǒchē tíng zài zhèlǐ? Yīnwèi yào děng chéngkè shàngchē.",
    question: "火车为什么停在站台？",
    options: [
      { text: "等乘客上车", correct: true },
      { text: "等司机吃饭", correct: false },
      { text: "等天气变好", correct: false }
    ],
    explainOk: '✅ 正确！"为什么"就是 why，问原因。因为要等乘客上车。',
    explainNo: '❌ 应该是"等乘客上车"。句子说"因为要等乘客上车"。'
  },
  {
    id: 5,
    word: "也",
    pinyin: "yě",
    meaning: "also / too",
    scene: "在火车站入口",
    sceneEn: "At the railway station entrance",
    sceneEmoji: "🚂",
    sentence: '我喜欢坐火车，姐姐<span class="hl">也</span>喜欢坐火车。',
    sentencePinyin: "Wǒ xǐhuan zuò huǒchē, jiějie yě xǐhuan zuò huǒchē.",
    question: "姐姐喜欢坐火车吗？",
    options: [
      { text: "喜欢", correct: true },
      { text: "不喜欢", correct: false },
      { text: "不知道", correct: false }
    ],
    explainOk: '✅ 正确！"也"就是 also。姐姐和"我"一样喜欢火车。',
    explainNo: '❌ 应该是"喜欢"。"也"表示同样喜欢，不是不喜欢。'
  },
  {
    id: 6,
    word: "运动",
    pinyin: "yùndòng",
    meaning: "sports / exercise",
    scene: "去体育馆的路上",
    sceneEn: "On the way to the sports center",
    sceneEmoji: "⚽",
    sentence: '我每天<span class="hl">运动</span>，因为运动对身体好。',
    sentencePinyin: "Wǒ měitiān yùndòng, yīnwèi yùndòng duì shēntǐ hǎo.",
    question: "什么对身体好？",
    options: [
      { text: "运动", correct: true },
      { text: "火车", correct: false },
      { text: "吃饭", correct: false }
    ],
    explainOk: '✅ 正确！"运动"就是 sports/exercise。运动对身体好！',
    explainNo: '❌ 应该是"运动"。句子说"运动对身体好"。'
  },
  {
    id: 7,
    word: "踢足球",
    pinyin: "tī zúqiú",
    meaning: "play football",
    scene: "在铁路公园",
    sceneEn: "At the railway park",
    sceneEmoji: "⚽",
    sentence: '小明和朋友在草地上<span class="hl">踢足球</span>。',
    sentencePinyin: "Xiǎomíng hé péngyou zài cǎodì shàng tī zúqiú.",
    question: "小明在草地上做什么？",
    options: [
      { text: "踢足球", correct: true },
      { text: "坐火车", correct: false },
      { text: "买火车票", correct: false }
    ],
    explainOk: '✅ 正确！"踢足球"就是 play football。他们在草地上踢足球。',
    explainNo: '❌ 应该是"踢足球"。句子说"在草地上踢足球"。'
  },
  {
    id: 8,
    word: "一起",
    pinyin: "yìqǐ",
    meaning: "together",
    scene: "在学校门口",
    sceneEn: "At the school gate",
    sceneEmoji: "🏫",
    sentence: '我们<span class="hl">一起</span>去火车站吧！',
    sentencePinyin: "Wǒmen yìqǐ qù huǒchēzhàn ba!",
    question: "说话的人想做什么？",
    options: [
      { text: "和大家一起去火车站", correct: true },
      { text: "一个人去火车站", correct: false },
      { text: "不去火车站", correct: false }
    ],
    explainOk: '✅ 正确！"一起"就是 together。我们一起去，不是一个人去。',
    explainNo: '❌ 应该是"和大家一起去火车站"。"一起"表示共同、一块儿。'
  },
  {
    id: 9,
    word: "要",
    pinyin: "yào",
    meaning: "want / need to",
    scene: "在售票窗口前",
    sceneEn: "At the ticket window",
    sceneEmoji: "🎫",
    sentence: '我<span class="hl">要</span>买一张去上海的火车票。',
    sentencePinyin: "Wǒ yào mǎi yī zhāng qù Shànghǎi de huǒchē piào.",
    question: '"我"想做什么？',
    options: [
      { text: "买火车票", correct: true },
      { text: "坐汽车", correct: false },
      { text: "去吃饭", correct: false }
    ],
    explainOk: '✅ 正确！"要"就是 want/need。我要买火车票去上海。',
    explainNo: '❌ 应该是"买火车票"。句子说"我要买一张火车票"。'
  },
  {
    id: 10,
    word: "新",
    pinyin: "xīn",
    meaning: "new",
    scene: "在新列车旁边",
    sceneEn: "Next to the new train",
    sceneEmoji: "🚅",
    sentence: '马东铁是一条<span class="hl">新</span>的铁路，很漂亮。',
    sentencePinyin: "Mǎdōngtiě shì yī tiáo xīn de tiělù, hěn piàoliang.",
    question: "马东铁是什么样的铁路？",
    options: [
      { text: "新的", correct: true },
      { text: "旧的", correct: false },
      { text: "小的", correct: false }
    ],
    explainOk: '✅ 正确！"新"就是 new。马东铁是新的铁路！',
    explainNo: '❌ 应该是"新的"。"新"表示 new，不是旧（old）。'
  },
  {
    id: 11,
    word: "它",
    pinyin: "tā",
    meaning: "it",
    scene: "在火车博物馆",
    sceneEn: "At the railway museum",
    sceneEmoji: "🚂",
    sentence: '这列火车很漂亮，<span class="hl">它</span>叫"复兴号"。',
    sentencePinyin: "Zhè liè huǒchē hěn piàoliang, tā jiào 'Fùxīng Hào'.",
    question: "这列火车叫什么名字？",
    options: [
      { text: "复兴号", correct: true },
      { text: "和谐号", correct: false },
      { text: "马东铁", correct: false }
    ],
    explainOk: '✅ 正确！"它"就是 it。"它叫复兴号"= It is called Fuxing Hao。',
    explainNo: '❌ 应该是"复兴号"。句子说"它叫复兴号"。'
  },
  {
    id: 12,
    word: "眼睛",
    pinyin: "yǎnjing",
    meaning: "eyes",
    scene: "在列车车窗旁",
    sceneEn: "By the train window",
    sceneEmoji: "👀",
    sentence: '在火车上，我用<span class="hl">眼睛</span>看窗外的风景。',
    sentencePinyin: "Zài huǒchē shàng, wǒ yòng yǎnjing kàn chuāng wài de fēngjǐng.",
    question: '"我"用什么看风景？',
    options: [
      { text: "眼睛", correct: true },
      { text: "耳朵", correct: false },
      { text: "嘴巴", correct: false }
    ],
    explainOk: '✅ 正确！"眼睛"就是 eyes。我们当然用眼睛看风景！',
    explainNo: '❌ 应该是"眼睛"。看风景用眼睛，不是耳朵或嘴巴。'
  }
];

// ========== 游戏状态 ==========
let currentQ = 0;
let score = 0;
let correctCount = 0;
let timerLeft = 25;
let timerInterval = null;
let answered = false;
let results = [];
const TOTAL_TIME = 25;
const POINTS = 10;

const $ = id => document.getElementById(id);

// ========== 渲染题目 ==========
function renderQuestion() {
  if (currentQ >= questions.length) { showResult(); return; }

  const q = questions[currentQ];
  answered = false;
  timerLeft = TOTAL_TIME;

  $("wordBadge").textContent = '📝 ' + q.word + ' ' + q.pinyin;
  $("qInfo").textContent = (currentQ + 1) + '/' + questions.length;
  $("progressFill").style.width = (currentQ / questions.length * 100) + '%';

  $("sceneCard").querySelector('.emoji').textContent = q.sceneEmoji;
  $("sceneTitle").textContent = q.scene;
  $("sceneCtx").textContent = q.sceneEn;

  $("sentenceText").innerHTML = q.sentence;
  $("pinyinRow").textContent = '🔊 ' + q.sentencePinyin;
  $("questionText").textContent = q.question;

  const optHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    return `<button class="opt-btn" onclick="selectAnswer(${i}, this)">
        <span class="letter">${letter}</span>
        <span class="word">${opt.text}</span>
      </button>`;
  }).join('');
  $("options").innerHTML = optHtml;

  $("feedback").textContent = '';
  $("feedback").className = 'feedback';
  $("nextBtn").style.display = 'none';
  $("timerRing").textContent = TOTAL_TIME;
  $("timerRing").className = 'timer-ring';

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerLeft--;
    $("timerRing").textContent = timerLeft;
    if (timerLeft <= 5) $("timerRing").className = 'timer-ring danger';
    else if (timerLeft <= 10) $("timerRing").className = 'timer-ring warn';
    if (timerLeft <= 0) { clearInterval(timerInterval); if (!answered) timeUp(); }
  }, 1000);
}

function timeUp() {
  answered = true;
  const q = questions[currentQ];
  results.push({ word: q.word, correct: false });
  const btns = $("options").querySelectorAll('.opt-btn');
  q.options.forEach((opt, i) => {
    btns[i].disabled = true;
    if (opt.correct) btns[i].classList.add('show-correct');
  });
  $("feedback").textContent = '⏰ 时间到！再读一遍句子：' + q.sentence.replace(/<[^>]*>/g,'');
  $("feedback").className = 'feedback no';
  $("nextBtn").style.display = 'inline-block';
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q = questions[currentQ];
  const chosen = q.options[idx];
  const btns = $("options").querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);
  q.options.forEach((opt, i) => { if (opt.correct) btns[i].classList.add('show-correct'); });

  if (chosen.correct) {
    btn.classList.add('correct');
    score += POINTS;
    if (timerLeft > 15) score += 5;
    else if (timerLeft > 5) score += 3;
    correctCount++;
    results.push({ word: q.word, correct: true });
    $("feedback").textContent = q.explainOk;
    $("feedback").className = 'feedback ok';
  } else {
    btn.classList.add('wrong');
    results.push({ word: q.word, correct: false });
    $("feedback").textContent = q.explainNo;
    $("feedback").className = 'feedback no';
  }
  $("nextBtn").style.display = 'inline-block';
}

function nextQuestion() { currentQ++; renderQuestion(); }

function showResult() {
  clearInterval(timerInterval);
  const pct = correctCount / questions.length;
  let emoji, title;
  if (pct >= 0.9) { emoji = '🏆'; title = '太棒了！你是中文小达人！'; }
  else if (pct >= 0.7) { emoji = '🎉'; title = '很好！继续加油！'; }
  else if (pct >= 0.5) { emoji = '💪'; title = '不错哦，再练一练！'; }
  else { emoji = '📚'; title = '没关系，多复习就会进步！'; }
  $("resultEmoji").textContent = emoji;
  $("resultTitle").textContent = title;
  $("resultScore").textContent = score + ' 分';
  $("resultStats").textContent = '答对 ' + correctCount + ' / ' + questions.length + ' 题';
  let reviewHtml = '<div style="font-weight:700;margin-bottom:6px;">📝 词汇回顾：</div>';
  results.forEach(r => {
    const cls = r.correct ? 'right' : 'wrong';
    const mark = r.correct ? '✅' : '❌';
    reviewHtml += '<span class="' + cls + '">' + mark + r.word + '</span> ';
  });
  $("wordsReview").innerHTML = reviewHtml;
  $("resultOverlay").classList.remove('hidden');
}

function restart() {
  currentQ = 0; score = 0; correctCount = 0; results = [];
  clearInterval(timerInterval);
  $("resultOverlay").classList.add('hidden');
  $("progressFill").style.width = '0%';
  renderQuestion();
}

renderQuestion();
</script>

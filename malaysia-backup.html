// ===== Login =====
function login(){
  var id=document.getElementById('studentId').value.trim();
  var cn=document.getElementById('chineseName').value.trim();
  var name=document.getElementById('studentName').value.trim();
  var code=document.getElementById('classCode').value.trim();
  var c=document.getElementById('consent').checked;
  if(!id||!name){alert('请填写学生编号和英文姓名');return;}
  if(code!=='MY2026'){alert('班级口令错误');return;}
  if(!c){alert('请勾选隐私同意');return;}
  student={id:id,name:name,chineseName:cn,learnerType:'international_student',learningTrack:'chinese_track',country:'Malaysia',source:'h5_backup'};
  localStorage.setItem('my_student_'+id,JSON.stringify(student));
  document.getElementById('loginBox').style.display='none';
  document.getElementById('taskList').style.display='block';
  document.getElementById('stuInfo').textContent='👤 '+(cn||name)+' ('+id+')';
  loadStatus();
}

function loadStatus(){
  if(!student) return;
  var key='my_status_'+student.id;
  var saved=localStorage.getItem(key);
  if(saved){var s=JSON.parse(saved);dayStatus=s.dayStatus||{};dayDrafts=s.dayDrafts||{};}
  // Also check from cloud
  checkCloudStatus();
  renderDayList();
}

function checkCloudStatus(){
  if(!student) return;
  var cb='_cs_'+Date.now();window[cb]=function(res){if(res&&res.data){res.data.forEach(function(r){if(r.studentId===student.id||r.name===student.name){var d=r.day;if(!dayStatus[d])dayStatus[d]=r.submitStatus||'submitted';}});saveLocal();renderDayList();}delete window[cb];};
  var s=document.createElement('script');s.src=API+'?callback='+cb+'&action=list';document.head.appendChild(s);
  setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},5000);
}

function saveLocal(){if(!student)return;var key='my_status_'+student.id;localStorage.setItem(key,JSON.stringify({dayStatus:dayStatus,dayDrafts:dayDrafts}));}

function renderDayList(){
  var h='';DAYS.forEach(function(d){
    var st=dayStatus[d.n];
    var cls='',statusText='';
    if(st==='submitted'){cls='done';statusText='✅ 已完成';}else if(st==='draft'){cls='draft';statusText='📝 草稿';}else{statusText='⬜ 去完成';}
    h+='<div class="day-card '+cls+'" onclick="openDay('+d.n+')"><div class="dc-num">'+(st==='submitted'?'✓':d.n)+'</div><div class="dc-info"><div class="dc-title">Day '+d.n+': '+d.t+'</div><div class="dc-sub">'+d.s+'</div></div><div class="dc-status">'+statusText+'</div></div>';
  });
  document.getElementById('dayList').innerHTML=h;
}

// ===== Open day panel =====
function openDay(day){
  var d=DAYS[day-1];var st=dayStatus[day]||'';var draft=dayDrafts[day]||{};
  var submitted=st==='submitted';
  var h='<div class="panel-header"><span class="panel-close" onclick="closeDay('+day+')">✕</span><div class="panel-day">Day '+day+' · '+d.s+'</div><div class="panel-title">'+d.t+'</div></div>';
  if(submitted)h+='<div class="task-block done"><span class="done-tag">✅ 已提交，老师可以查看</span></div>';
  h+=d.content(day,draft);
  // Self eval
  h+='<div class="task-block"><h4>💭 自评 Self Evaluation</h4>';
  h+='<span class="hint">难度（1=简单,5=困难）:</span><div class="eval-opts">';for(var i=1;i<=5;i++)h+='<label class="eval-opt"><input type="radio" name="diff'+day+'" value="'+i+'" '+(draft.diff==i?'checked':'')+'> '+i+'</label>';h+='</div>';
  h+='<span class="hint">信心（1=低,5=高）:</span><div class="eval-opts">';for(var i=1;i<=5;i++)h+='<label class="eval-opt"><input type="radio" name="conf'+day+'" value="'+i+'" '+(draft.conf==i?'checked':'')+'> '+i+'</label>';h+='</div>';
  h+='<span class="hint">今天我想说：</span><input class="fill-input" placeholder="..." id="comment'+day+'" value="'+(draft.comment||'')+'"></div>';

  h+='<div class="bottom-bar">';
  if(!submitted)h+='<button class="btn btn-draft" onclick="saveDraft('+day+')">💾 保存草稿</button>';
  h+='<button class="btn btn-submit" onclick="submitDay('+day+')">'+(submitted?'🔄 重新提交':'📤 提交今天任务')+'</button>';
  h+='<button class="btn btn-back" onclick="closeDay('+day+')">← 返回列表</button></div>';

  h+='<div class="status-msg" id="msg'+day+'"></div>';
  document.getElementById('panel').innerHTML=h;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}

function closeDay(day){document.getElementById('overlay').classList.remove('show');document.getElementById('panel').classList.remove('show');}

// ===== Collect answers =====
function collectAnswers(day){
  var ans={};var inputs=document.querySelectorAll('#panel input[type="radio"]:checked, #panel input[type="checkbox"]:checked, #panel input.fill-input, #panel textarea');
  inputs.forEach(function(el){
    var id=el.id||el.name;if(!id)return;
    if(el.type==='radio'||el.type==='checkbox')ans[id]=el.value;
    else ans[id]=el.value;
  });
  ans.diff=document.querySelector('input[name="diff'+day+'"]:checked');ans.diff=ans.diff?ans.diff.value:'';
  ans.conf=document.querySelector('input[name="conf'+day+'"]:checked');ans.conf=ans.conf?ans.conf.value:'';
  ans.comment=document.getElementById('comment'+day);ans.comment=ans.comment?ans.comment.value:'';
  return ans;
}

// ===== Save draft =====
function saveDraft(day){
  var ans=collectAnswers(day);dayDrafts[day]=ans;dayStatus[day]='draft';
  saveLocal();renderDayList();
  var m=document.getElementById('msg'+day);m.textContent='✅ 草稿已保存';m.className='status-msg show';
  setTimeout(function(){m.className='status-msg';},2000);
}

// ===== Submit to cloud =====
function submitDay(day){
  if(dayStatus[day]==='submitted'){
    if(!confirm('今天已经提交过。确定要重新提交吗？'))return;
  }
  var ans=collectAnswers(day);
  var d=DAYS[day-1];
  var params={
    action:'submit',name:student.name,studentName:student.name,studentId:student.id,chineseName:student.chineseName,learnerType:student.learnerType,learningTrack:student.learningTrack,country:student.country,source:'h5_backup',weekId:'MY_WEEK_001',day:day,taskTitle:d.t,activityType:d.s,
    choiceAnswers:JSON.stringify(ans),fillAnswers:JSON.stringify(ans),writingText:(ans['d'+day+'write']||ans.write||''),speakingText:(ans['d'+day+'speak']||ans.speak||''),
    selfDifficulty:ans.diff||'',selfConfidence:ans.conf||'',selfComment:ans.comment||'',
    submitStatus:'submitted',submitTime:new Date().toISOString()
  };
  var cb='_sub_'+Date.now();window[cb]=function(res){
    if(res&&res.ok){dayStatus[day]='submitted';dayDrafts[day]=ans;saveLocal();renderDayList();
      var m=document.getElementById('msg'+day);m.textContent='✅ 提交成功，老师已经可以看到你的学习记录。';m.className='status-msg show';setTimeout(function(){m.className='status-msg';},3000);}
    else{alert('提交失败，请重试');}delete window[cb];
  };
  var qs='callback='+cb;for(var k in params){qs+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}
  var s=document.createElement('script');s.src=API+'?'+qs;document.head.appendChild(s);
  setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},5000);
}

renderDayList();
</script>

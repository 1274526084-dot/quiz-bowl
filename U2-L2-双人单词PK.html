<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>U2-L2 双人单词PK · 课堂对战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0d1117; color: #fff; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- TOP BAR ---- */
  .top-bar {
    display: flex; align-items: center; justify-content: center; gap: 40px;
    padding: 8px 16px; background: #161b22; flex-shrink: 0;
    border-bottom: 2px solid #30363d; height: 64px;
  }
  .p-summary {
    display: flex; align-items: center; gap: 12px; min-width: 220px;
  }
  .p-summary.p1s { justify-content: flex-end; }
  .p-summary.p2s { justify-content: flex-start; }

  .p-dot {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  }
  .p-dot.p1 { background: #58a6ff; box-shadow: 0 0 12px #58a6ff88; }
  .p-dot.p2 { background: #f85149; box-shadow: 0 0 12px #f8514988; }

  .p-info { text-align: right; }
  .p2s .p-info { text-align: left; }
  .p-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .p1s .p-label { color: #58a6ff; }
  .p2s .p-label { color: #f85149; }
  .p-stats { font-size: 11px; color: #8b949e; }
  .p-stats b { font-size: 15px; }
  .p1s .p-stats b { color: #58a6ff; }
  .p2s .p-stats b { color: #f85149; }

  .top-vs {
    font-size: 13px; font-weight: 900; color: #e6b422;
    background: #21262d; border-radius: 8px; padding: 6px 16px;
    letter-spacing: 2px;
  }

  /* ---- MAIN AREA ---- */
  .main-area {
    flex: 1; display: flex; min-height: 0;
  }

  /* ---- DIVIDER ---- */
  .divider {
    width: 4px; flex-shrink: 0; background: linear-gradient(180deg, #58a6ff, #e6b422, #f85149);
    position: relative; z-index: 2;
  }

  /* ---- PLAYER PANEL ---- */
  .player-panel {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 14px 16px; gap: 10px; min-width: 0; position: relative;
    justify-content: center;
  }
  .p1-panel { background: linear-gradient(90deg, #0d2137 0%, #0d1520 100%); }
  .p2-panel { background: linear-gradient(90deg, #0d1520 0%, #2d0d0d 100%); }

  /* ---- TIMER PER PLAYER ---- */
  .timer-badge {
    text-align: center;
  }
  .timer-count {
    font-size: 56px; font-weight: 900; line-height: 1;
    transition: color 0.3s;
  }
  .p1-panel .timer-count { color: #58a6ff; }
  .p2-panel .timer-count { color: #f85149; }
  .timer-count.warn { color: #d2991b !important; }
  .timer-count.danger { color: #f85149 !important; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .timer-label { font-size: 10px; color: #484f58; letter-spacing: 2px; }

  /* ---- QUESTION ---- */
  .q-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 14px;
    padding: 14px 16px; text-align: center; width: 100%; max-width: 420px;
  }
  .q-context {
    font-size: 11px; color: #e6b422; letter-spacing: 2px; margin-bottom: 6px;
    text-transform: uppercase;
  }
  .q-sentence {
    font-size: 17px; color: #c9d1d9; line-height: 1.7; font-weight: 500;
  }
  .q-sentence .blank {
    display: inline-block; background: #21262d; color: #e6b422;
    border-radius: 5px; padding: 1px 12px; border-bottom: 2px dashed #e6b422;
    font-weight: 700;
  }

  /* ---- OPTIONS ---- */
  .opts-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    width: 100%; max-width: 420px;
  }
  .opt-btn {
    background: #21262d; border: 2px solid #30363d; border-radius: 12px;
    padding: 16px 10px; color: #c9d1d9; font-size: 16px; font-weight: 700;
    cursor: pointer; text-align: center; transition: all 0.1s;
    -webkit-tap-highlight-color: transparent; min-height: 52px;
    display: flex; align-items: center; justify-content: center; word-break: break-all;
  }
  .p1-panel .opt-btn { border-color: #1f6feb33; }
  .p2-panel .opt-btn { border-color: #da363333; }
  .opt-btn:active { transform: scale(0.95); }
  .opt-btn.correct { background: #1a3a2a; border-color: #3fb950; color: #3fb950; animation: pop 0.3s; }
  .opt-btn.wrong { background: #3a1a1a; border-color: #f85149; color: #f85149; animation: shake 0.4s; }
  .opt-btn.reveal { background: #1a2a3a; border-color: #3fb950; color: #3fb950; }
  .opt-btn.locked { pointer-events: none; opacity: 0.3; }
  .opt-btn.disabled { pointer-events: none; }
  @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.06);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

  /* ---- FLASH ---- */
  .flash {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
    font-size: 64px; pointer-events: none; opacity: 0; z-index: 20;
    transition: opacity 0.12s;
  }
  .flash.show { opacity: 1; }

  /* ---- DONE STATE ---- */
  .done-overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0,0,0,0.7); z-index: 10;
    font-size: 28px; font-weight: 900; pointer-events: none;
  }
  .p1-panel .done-overlay { color: #58a6ff; }
  .p2-panel .done-overlay { color: #f85149; }

  /* ---- OVERLAY ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .overlay.hidden { display: none; }

  .dialog {
    background: #161b22; border-radius: 24px; padding: 36px 32px; text-align: center;
    max-width: 500px; width: 90%; border: 2px solid #30363d;
  }
  .dialog h2 { font-size: 30px; margin-bottom: 8px; }
  .dialog .vs { color: #e6b422; font-size: 14px; margin-bottom: 24px; }

  .btn-go {
    background: #e6b422; color: #0d1117; border: none; border-radius: 50px;
    padding: 16px 52px; font-size: 20px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: all 0.15s;
  }
  .btn-go:hover { background: #f0c840; }
  .btn-go:active { transform: scale(0.95); }

  .winner-emoji { font-size: 64px; margin-bottom: 10px; }
  .winner-text { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
  .winner-sub { font-size: 14px; color: #e6b422; margin-bottom: 24px; }

  .score-compare {
    display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 28px;
  }
  .sc-item { text-align: center; min-width: 100px; }
  .sc-num { font-size: 44px; font-weight: 900; line-height: 1; }
  .sc-label { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .sc-sub { font-size: 12px; color: #6e7681; margin-top: 2px; }
  .sc-vs { font-size: 20px; color: #484f58; font-weight: 900; }

  /* Smaller screens */
  @media (max-width: 800px) {
    .opt-btn { padding: 12px 6px; font-size: 13px; min-height: 40px; }
    .q-sentence { font-size: 14px; }
    .timer-count { font-size: 40px; }
    .opts-grid { gap: 6px; }
  }
</style>
</head>
<body>

<!-- ====== WELCOME ====== -->
<div class="overlay" id="welcomeOverlay">
  <div class="dialog">
    <h2>🚄 双人单词PK</h2>
    <div class="vs">U2-L2 新生词 · 铁路场景 · 独立作答 · 触屏对战</div>
    <div style="display:flex;gap:32px;justify-content:center;margin-bottom:20px;text-align:center;">
      <div style="color:#58a6ff;">
        <div style="font-size:48px;font-weight:900;">🔵</div>
        <div style="font-size:14px;font-weight:700;">Player 1</div>
        <div style="font-size:11px;color:#8b949e;">左侧屏幕作答</div>
      </div>
      <div style="color:#f85149;">
        <div style="font-size:48px;font-weight:900;">🔴</div>
        <div style="font-size:14px;font-weight:700;">Player 2</div>
        <div style="font-size:11px;color:#8b949e;">右侧屏幕作答</div>
      </div>
    </div>
    <div style="font-size:12px;color:#8b949e;line-height:1.8;margin-bottom:24px;">
      两人各自独立完成 15 道题 · 每题 10 秒限时<br>
      答对 +10 分 · 答错 -5 分并锁定 2 秒<br>
      最后比较<b style="color:#e6b422;">得分</b>和<b style="color:#e6b422;">用时</b>
    </div>
    <button class="btn-go" onclick="startGame()">开始对战</button>
  </div>
</div>

<!-- ====== RESULT ====== -->
<div class="overlay hidden" id="resultOverlay">
  <div class="dialog" id="resultDialog"></div>
</div>

<!-- ====== TOP BAR ====== -->
<div class="top-bar">
  <div class="p-summary p1s">
    <div>
      <div class="p-label">Player 1</div>
      <div class="p-stats">得分 <b id="p1ScoreTop">0</b> · 用时 <b id="p1TimeTop">0s</b> · 进度 <b id="p1Progress">0/15</b></div>
    </div>
    <div class="p-dot p1"></div>
  </div>

  <div class="top-vs">VS</div>

  <div class="p-summary p2s">
    <div class="p-dot p2"></div>
    <div class="p-info">
      <div class="p-label">Player 2</div>
      <div class="p-stats">得分 <b id="p2ScoreTop">0</b> · 用时 <b id="p2TimeTop">0s</b> · 进度 <b id="p2Progress">0/15</b></div>
    </div>
  </div>
</div>

<!-- ====== MAIN ====== -->
<div class="main-area">
  <!-- P1 LEFT -->
  <div class="player-panel p1-panel" id="p1Panel">
    <div class="timer-badge">
      <div class="timer-count" id="p1Timer">10</div>
      <div class="timer-label">SECONDS</div>
    </div>
    <div class="q-card">
      <div class="q-context" id="p1Context">——</div>
      <div class="q-sentence" id="p1Sentence"></div>
    </div>
    <div class="opts-grid" id="p1Options"></div>
    <div class="flash" id="p1Flash"></div>
    <div class="done-overlay hidden" id="p1Done">✅ 完成</div>
  </div>

  <!-- DIVIDER -->
  <div class="divider"></div>

  <!-- P2 RIGHT -->
  <div class="player-panel p2-panel" id="p2Panel">
    <div class="timer-badge">
      <div class="timer-count" id="p2Timer">10</div>
      <div class="timer-label">SECONDS</div>
    </div>
    <div class="q-card">
      <div class="q-context" id="p2Context">——</div>
      <div class="q-sentence" id="p2Sentence"></div>
    </div>
    <div class="opts-grid" id="p2Options"></div>
    <div class="flash" id="p2Flash"></div>
    <div class="done-overlay hidden" id="p2Done">✅ 完成</div>
  </div>
</div>

<script>
var QUESTIONS = [
  { sentence: "The mechanic had to <span class='blank'>___</span> that he forgot to check the brake system.", answer: "admit", context: "车辆维修" },
  { sentence: "The safety <span class='blank'>___</span> inspected the new signaling equipment at the station.", answer: "advisor", context: "安全检查" },
  { sentence: "The <span class='blank'>___</span> young engineer wants to redesign the entire maintenance workflow.", answer: "ambitious", context: "技术创新" },
  { sentence: "Each <span class='blank'>___</span> for the train driver position must pass a strict health examination.", answer: "candidate", context: "招聘选拔" },
  { sentence: "The chief inspector made a positive <span class='blank'>___</span> about the clean engine room.", answer: "comment", context: "质量检查" },
  { sentence: "Every repair procedure must be <span class='blank'>___</span>ed in the maintenance logbook.", answer: "document", context: "维修记录" },
  { sentence: "Heavy snowfall can have a serious <span class='blank'>___</span> on the railway timetable.", answer: "impact", context: "极端天气" },
  { sentence: "The railway company will <span class='blank'>___</span> free technical training to all new employees.", answer: "offer", context: "员工培训" },
  { sentence: "A well-<span class='blank'>___</span> maintenance team can repair the electric multiple unit much faster.", answer: "organized", context: "动车维修" },
  { sentence: "The <span class='blank'>___</span> of the new high-speed train has exceeded all expectations.", answer: "performance", context: "高铁性能" },
  { sentence: "We need to set a <span class='blank'>___</span> timeline for the track replacement project.", answer: "realistic", context: "轨道施工" },
  { sentence: "Passenger safety is the primary <span class='blank'>___</span> of every crew member on board.", answer: "responsibility", context: "客运安全" },
  { sentence: "Engineers discovered a structural <span class='blank'>___</span> in the steel bridge during routine inspection.", answer: "weakness", context: "桥梁检测" },
  { sentence: "The locomotive depot is a busy <span class='blank'>___</span> that operates 24 hours a day.", answer: "workplace", context: "机务段" },
  { sentence: "Lack of sleep can <span class='blank'>___</span> <span class='blank'>___</span> <span class='blank'>___</span> <span class='blank'>___</span> <span class='blank'>___</span> a driver's concentration and reaction speed.", answer: "have a negative impact on", context: "行车安全" }
];

var ALL_WORDS = QUESTIONS.map(function(q) { return q.answer; });

// Per-player state: { roundIdx, score, totalTime, timerLeft, timerInterval, locked, answered, optWords }
var p1 = {}, p2 = {};
var gameOver = false;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pickOptions(answer) {
  var others = ALL_WORDS.filter(function(w) { return w !== answer; });
  return shuffle(shuffle(others).slice(0, 3).concat(answer));
}

// ===== START =====
function startGame() {
  gameOver = false;

  // Random question order — same for both
  var order = shuffle(QUESTIONS);

  p1 = { roundIdx: 0, score: 0, totalTime: 0, timerLeft: 10, timerInterval: null, locked: false, answered: false, optWords: [], order: order };
  p2 = { roundIdx: 0, score: 0, totalTime: 0, timerLeft: 10, timerInterval: null, locked: false, answered: false, optWords: [], order: shuffle(QUESTIONS) };

  document.getElementById("p1Done").classList.add("hidden");
  document.getElementById("p2Done").classList.add("hidden");
  document.getElementById("welcomeOverlay").classList.add("hidden");
  document.getElementById("resultOverlay").classList.add("hidden");

  updateTopBar();
  loadPlayerRound(1);
  loadPlayerRound(2);
}

// ===== LOAD ROUND FOR ONE PLAYER =====
function loadPlayerRound(player) {
  var s = player === 1 ? p1 : p2;
  var pfx = player === 1 ? "p1" : "p2";

  if (s.roundIdx >= 15) {
    // Player done
    clearInterval(s.timerInterval);
    document.getElementById(pfx + "Timer").textContent = "✓";
    document.getElementById(pfx + "Context").textContent = "——";
    document.getElementById(pfx + "Sentence").innerHTML = "";
    document.getElementById(pfx + "Options").innerHTML = "";
    document.getElementById(pfx + "Done").classList.remove("hidden");
    if (p1.roundIdx >= 15 && p2.roundIdx >= 15) endGame();
    return;
  }

  var q = s.order[s.roundIdx];
  s.optWords = pickOptions(q.answer);
  s.timerLeft = 10;
  s.answered = false;
  s.locked = false;

  document.getElementById(pfx + "Timer").textContent = "10";
  document.getElementById(pfx + "Timer").className = "timer-count";
  document.getElementById(pfx + "Context").textContent = q.context;
  document.getElementById(pfx + "Sentence").innerHTML = q.sentence;

  renderOptions(pfx + "Options", s.optWords);

  // Start per-player timer
  clearInterval(s.timerInterval);
  s.timerInterval = setInterval(function() {
    s.timerLeft = Math.max(0, s.timerLeft - 0.1);
    var sec = Math.ceil(s.timerLeft);
    var el = document.getElementById(pfx + "Timer");
    el.textContent = sec;
    el.className = "timer-count" + (s.timerLeft < 3 ? " danger" : s.timerLeft < 5 ? " warn" : "");
    if (s.timerLeft <= 0) {
      clearInterval(s.timerInterval);
      if (!s.answered) playerTimeUp(player);
    }
  }, 100);
}

function renderOptions(gridId, words) {
  var grid = document.getElementById(gridId);
  grid.innerHTML = "";
  words.forEach(function(word) {
    var btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = word;
    btn.setAttribute("data-word", word);
    grid.appendChild(btn);
  });
}

// Attach click handlers via delegation
document.getElementById("p1Options").addEventListener("click", function(e) {
  if (e.target.classList.contains("opt-btn") && !e.target.classList.contains("locked") && !e.target.classList.contains("disabled")) {
    p1Click(e.target.getAttribute("data-word"), e.target);
  }
});
document.getElementById("p2Options").addEventListener("click", function(e) {
  if (e.target.classList.contains("opt-btn") && !e.target.classList.contains("locked") && !e.target.classList.contains("disabled")) {
    p2Click(e.target.getAttribute("data-word"), e.target);
  }
});

function p1Click(word, btn) { handleAnswer(1, word, btn); }
function p2Click(word, btn) { handleAnswer(2, word, btn); }

// ===== ANSWER =====
function handleAnswer(player, chosen, btn) {
  if (gameOver) return;
  var s = player === 1 ? p1 : p2;
  var pfx = player === 1 ? "p1" : "p2";
  if (s.answered || s.locked || s.roundIdx >= 15) return;

  var q = s.order[s.roundIdx];

  if (chosen === q.answer) {
    s.answered = true;
    clearInterval(s.timerInterval);
    s.totalTime += (10 - s.timerLeft);
    s.score += 10;

    btn.classList.add("correct");
    flashPlayer(player, "✅");
    updateTopBar();

    setTimeout(function() {
      s.roundIdx++;
      updateTopBar();
      loadPlayerRound(player);
    }, 600);
  } else {
    // Wrong
    s.score = Math.max(0, s.score - 5);
    s.locked = true;
    btn.classList.add("wrong");
    flashPlayer(player, "❌");
    updateTopBar();

    // Reveal correct briefly
    var grid = document.getElementById(pfx + "Options");
    var btns = grid.querySelectorAll(".opt-btn");
    btns.forEach(function(b) {
      b.classList.add("locked");
      if (b.getAttribute("data-word") === q.answer) b.classList.add("reveal");
    });

    setTimeout(function() {
      s.locked = false;
      btns.forEach(function(b) {
        b.classList.remove("locked", "wrong", "reveal");
      });
      // Reset timer
      s.timerLeft = 10;
      document.getElementById(pfx + "Timer").textContent = "10";
      document.getElementById(pfx + "Timer").className = "timer-count";
    }, 2000);
  }
}

function playerTimeUp(player) {
  var s = player === 1 ? p1 : p2;
  var pfx = player === 1 ? "p1" : "p2";
  if (s.answered || s.roundIdx >= 15) return;

  s.answered = true;
  s.totalTime += 10;

  // Reveal answer
  var q = s.order[s.roundIdx];
  var grid = document.getElementById(pfx + "Options");
  var btns = grid.querySelectorAll(".opt-btn");
  btns.forEach(function(b) {
    b.classList.add("disabled");
    if (b.getAttribute("data-word") === q.answer) b.classList.add("reveal");
  });

  flashPlayer(player, "⏰");
  updateTopBar();

  setTimeout(function() {
    s.roundIdx++;
    updateTopBar();
    loadPlayerRound(player);
  }, 1200);
}

// ===== FLASH =====
function flashPlayer(player, emoji) {
  var el = document.getElementById(player === 1 ? "p1Flash" : "p2Flash");
  el.textContent = emoji;
  el.classList.add("show");
  setTimeout(function() { el.classList.remove("show"); }, 500);
}

// ===== TOP BAR =====
function updateTopBar() {
  document.getElementById("p1ScoreTop").textContent = p1.score;
  document.getElementById("p1TimeTop").textContent = p1.totalTime.toFixed(1) + "s";
  document.getElementById("p1Progress").textContent = p1.roundIdx + "/15";

  document.getElementById("p2ScoreTop").textContent = p2.score;
  document.getElementById("p2TimeTop").textContent = p2.totalTime.toFixed(1) + "s";
  document.getElementById("p2Progress").textContent = p2.roundIdx + "/15";
}

// ===== END =====
function endGame() {
  gameOver = true;
  clearInterval(p1.timerInterval);
  clearInterval(p2.timerInterval);

  // Determine winner: higher score wins; if tie, faster time wins
  var winnerEmoji, winnerText, sub;
  if (p1.score > p2.score) {
    winnerEmoji = "🔵"; winnerText = "Player 1 获胜！"; sub = "得分领先 " + (p1.score - p2.score) + " 分";
  } else if (p2.score > p1.score) {
    winnerEmoji = "🔴"; winnerText = "Player 2 获胜！"; sub = "得分领先 " + (p2.score - p1.score) + " 分";
  } else if (p1.totalTime < p2.totalTime) {
    winnerEmoji = "🔵"; winnerText = "Player 1 获胜！"; sub = "同分但更快 " + (p2.totalTime - p1.totalTime).toFixed(1) + "s";
  } else if (p2.totalTime < p1.totalTime) {
    winnerEmoji = "🔴"; winnerText = "Player 2 获胜！"; sub = "同分但更快 " + (p1.totalTime - p2.totalTime).toFixed(1) + "s";
  } else {
    winnerEmoji = "🤝"; winnerText = "完全平局！"; sub = "得分相同用时相同";
  }

  document.getElementById("resultDialog").innerHTML =
    '<div class="winner-emoji">' + winnerEmoji + '</div>' +
    '<div class="winner-text">' + winnerText + '</div>' +
    '<div class="winner-sub">' + sub + '</div>' +
    '<div class="score-compare">' +
      '<div class="sc-item">' +
        '<div class="sc-num" style="color:#58a6ff">' + p1.score + '</div>' +
        '<div class="sc-label">Player 1 得分</div>' +
        '<div class="sc-sub">用时 ' + p1.totalTime.toFixed(1) + 's</div>' +
      '</div>' +
      '<div class="sc-vs">VS</div>' +
      '<div class="sc-item">' +
        '<div class="sc-num" style="color:#f85149">' + p2.score + '</div>' +
        '<div class="sc-label">Player 2 得分</div>' +
        '<div class="sc-sub">用时 ' + p2.totalTime.toFixed(1) + 's</div>' +
      '</div>' +
    '</div>' +
    '<button class="btn-go" onclick="restartGame()">再来一局</button>';

  document.getElementById("resultOverlay").classList.remove("hidden");
}

function restartGame() {
  document.getElementById("resultOverlay").classList.add("hidden");
  document.getElementById("welcomeOverlay").classList.remove("hidden");
  // cleanup
  ["p1Options", "p2Options"].forEach(function(id) { document.getElementById(id).innerHTML = ""; });
  document.getElementById("p1Sentence").innerHTML = "";
  document.getElementById("p2Sentence").innerHTML = "";
  document.getElementById("p1Context").textContent = "——";
  document.getElementById("p2Context").textContent = "——";
  document.getElementById("p1Timer").textContent = "10";
  document.getElementById("p2Timer").textContent = "10";
  document.getElementById("p1Timer").className = "timer-count";
  document.getElementById("p2Timer").className = "timer-count";
}
</script>
</body>
</html>

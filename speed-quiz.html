<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>限时速答 · ECRL</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#fef2f2 0%,#fff7ed 50%,#f8fafc 100%);min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto}.header{text-align:center;margin-bottom:16px}.header .badge{display:inline-block;padding:4px 18px;border-radius:20px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;letter-spacing:2px}.header h2{color:#1e293b;font-size:20px;margin-top:6px}
.timer-bar{height:8px;background:#e2e8f0;border-radius:4px;margin-bottom:16px;overflow:hidden}.timer-fill{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#dc2626);border-radius:4px;transition:width 0.1s linear;width:100%}
.timer-num{text-align:center;font-size:48px;font-weight:900;color:#dc2626;margin-bottom:12px;font-family:'Courier New',monospace}.timer-num.urgent{animation:pulse 0.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.q-box{background:#fff;border-radius:14px;padding:24px;text-align:center;margin-bottom:14px;border:2px solid #e2e8f0}.q-sentence{font-size:16px;color:#1e293b;font-weight:600;line-height:1.8;margin-bottom:18px}.q-blank{display:inline-block;min-width:80px;border-bottom:3px solid #dc2626;margin:0 4px;vertical-align:bottom;color:#dc2626}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{padding:22px 12px;border-radius:12px;border:3px solid #e2e8f0;background:#fff;font-size:18px;font-weight:800;cursor:pointer;text-align:center;transition:all 0.1s}.choice:hover{border-color:#93c5fd}.choice:active{transform:scale(0.95)}.choice.correct{border-color:#22c55e;background:#f0fdf4;color:#16a34a;pointer-events:none}.choice.wrong{border-color:#dc2626;background:#fef2f2;color:#dc2626;pointer-events:none}
.score-bar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 16px;border-radius:12px;border:2px solid #e2e8f0}.score{font-size:22px;font-weight:800;color:#dc2626}.btn{padding:10px 24px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:#dc2626;color:#fff}.btn:active{transform:scale(0.95)}
.start-wrap{text-align:center;padding:40px 0}.start-wrap .big{font-size:64px;display:block;margin-bottom:12px}
.link-row{margin-top:16px;text-align:center}.link-row a{color:#64748b;font-size:12px;text-decoration:none}
</style></head><body><div class="container">
<div class="header"><div class="badge">SPEED QUIZ</div><h2>⏱ 限时速答 · ECRL 乘务知识</h2></div>
<div class="start-wrap" id="startWrap"><span class="big">⏱</span><h3>每题8秒，快速作答！</h3><button class="btn" onclick="startGame()" style="padding:16px 40px;font-size:18px">⚡ 开始挑战</button></div>
<div id="gameArea" style="display:none">
<div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
<div class="timer-num" id="timerNum">8</div>
<div class="q-box"><div class="q-sentence" id="qSentence"></div><div class="choices" id="choices"></div></div>
<div class="score-bar"><span class="score" id="scoreDisplay">得分: 0</span><button class="btn" onclick="startGame()">🔄 重来</button></div>
</div>
<div class="link-row"><a href="hub.html">← 返回任务中心</a></div>
</div>
<script>
var questions=[{q:'The train will ___ at Platform 3 in five minutes.',choices:['arrive','arrival'],answer:'arrive',explain:'arrive=到达(动词);arrival=到达(名词)'},{q:'Please keep your ___ with you at all times.',choices:['luggage','passenger'],answer:'luggage',explain:'luggage=行李;passenger=乘客'},{q:'You can ___ your seat online before departure.',choices:['reserve','serve'],answer:'reserve',explain:'reserve=预订;serve=服务'},{q:'Smoking is strictly ___ on all ECRL trains.',choices:['prohibited','permitted'],answer:'prohibited',explain:'prohibited=禁止;permitted=允许'},{q:'The dining car is ___ Carriage 5 and Carriage 6.',choices:['between','among'],answer:'between',explain:'between=两者之间;among=三者或以上之间'},{q:'We ___ at the next station in approximately ten minutes.',choices:['will arrive','arrived'],answer:'will arrive',explain:'will arrive=将要到达(将来时);arrived=已到达(过去式)'},{q:'Please ___ your seatbelt while seated for safety.',choices:['fasten','loosen'],answer:'fasten',explain:'fasten=系紧(安全带);loosen=松开'},{q:'___ passengers may board the train first.',choices:['Elderly','Young'],answer:'Elderly',explain:'Elderly=年长的(乘客优先);Young=年轻的'}];
var idx=0,score=0,timer=null,tSec=0,answered=false;
function startGame(){clearInterval(timer);idx=0;score=0;answered=false;document.getElementById('startWrap').style.display='none';document.getElementById('gameArea').style.display='block';document.getElementById('scoreDisplay').textContent='得分: 0';renderQ();}
function renderQ(){if(idx>=questions.length){document.getElementById('timerNum').textContent='🏆';document.getElementById('timerNum').classList.remove('urgent');document.getElementById('timerFill').style.width='100%';setTimeout(function(){alert('🎉 挑战结束！得分: '+score+'/'+questions.length);},300);return;}
var q=questions[idx];answered=false;document.getElementById('qSentence').innerHTML=q.q.replace('___','<span class="q-blank">___</span>');tSec=8;document.getElementById('timerNum').textContent=tSec;document.getElementById('timerNum').classList.remove('urgent');document.getElementById('timerFill').style.width='100%';
var h='';q.choices.forEach(function(c){h+='<button class="choice" onclick="answer(\''+c+'\')">'+c+'</button>';});document.getElementById('choices').innerHTML=h;
clearInterval(timer);timer=setInterval(function(){tSec--;document.getElementById('timerNum').textContent=tSec;document.getElementById('timerFill').style.width=(tSec/8*100)+'%';if(tSec<=3)document.getElementById('timerNum').classList.add('urgent');if(tSec<=0){clearInterval(timer);timeUp();}},1000);}
function answer(choice){if(answered)return;answered=true;clearInterval(timer);var q=questions[idx],ok=choice===q.answer;if(ok)score++;document.getElementById('scoreDisplay').textContent='得分: '+score;var btns=document.querySelectorAll('.choice');btns.forEach(function(b){b.style.pointerEvents='none';if(b.textContent===q.answer)b.classList.add('correct');if(b.textContent===choice&&!ok)b.classList.add('wrong');});idx++;setTimeout(renderQ,1000);}
function timeUp(){answered=true;var btns=document.querySelectorAll('.choice');btns.forEach(function(b){b.style.pointerEvents='none';if(b.textContent===questions[idx].answer)b.classList.add('correct');});idx++;setTimeout(renderQ,1200);}
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Adverb Quiz · 副词选择题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  min-height:100vh;min-height:100dvh;
  background:linear-gradient(135deg,#fdf2f8 0%,#eff6ff 50%,#fdf2f8 100%);
  padding:8px;
}
.container{max-width:720px;margin:0 auto}

.header{text-align:center;margin-bottom:6px}
.header .badge{
  display:inline-block;padding:3px 14px;border-radius:20px;
  background:#FCE7F3;color:#DB2777;font-size:13px;font-weight:700;
  letter-spacing:2px;margin-bottom:2px;
}
.header h2{color:#2563EB;font-size:22px}

/* BIG Stopwatch — central focal point */
.stopwatch-block{
  text-align:center;margin-bottom:8px;
}
.stopwatch-block .label{
  font-size:11px;color:#64748B;letter-spacing:3px;text-transform:uppercase;
}
.stopwatch-block .time{
  font-size:42px;font-weight:900;font-family:'Courier New',monospace;
  color:#2563EB;line-height:1.1;
}
.stopwatch-block .time.running{color:#059669}

/* Progress */
.progress-row{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;
}
.progress-num{font-size:14px;font-weight:700;color:#64748B}
.progress-dot{
  width:12px;height:12px;border-radius:50%;background:#E2E8F0;transition:all 0.3s;
}
.progress-dot.done{background:#059669}
.progress-dot.wrong{background:#DC2626}
.progress-dot.cur{background:#2563EB;box-shadow:0 0 0 5px rgba(37,99,235,0.2)}

/* Question */
.q-box{
  background:linear-gradient(135deg,#f8fafc,#f1f5f9);
  border:2px solid #E2E8F0;border-radius:18px;padding:22px 16px;
  margin-bottom:14px;text-align:center;
}
.q-box .context{
  font-size:16px;color:#475569;line-height:1.7;margin-bottom:10px;
}
.q-box .sentence{
  font-size:26px;color:#1E293B;font-weight:600;line-height:1.8;
}
.q-box .sentence b{color:#DB2777}
.q-box .blank{
  display:inline-block;min-width:150px;border-bottom:4px solid #2563EB;
  margin:0 6px;vertical-align:bottom;color:#2563EB;
}

/* Choices — BIG buttons */
.choices{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:10px;
}
.choice{
  padding:28px 14px;border:4px solid #E2E8F0;border-radius:18px;
  background:#fff;font-size:28px;font-weight:800;cursor:pointer;
  text-align:center;transition:all 0.12s;color:#1E293B;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.choice:active{transform:scale(0.94)}
.choice.correct{border-color:#059669;background:#D1FAE5;color:#065F46;pointer-events:none}
.choice.wrong{border-color:#DC2626;background:#FEE2E2;color:#991B1B;pointer-events:none;animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Feedback */
.feedback{
  min-height:56px;padding:14px 18px;border-radius:14px;
  font-size:16px;font-weight:600;text-align:center;line-height:1.7;
  display:none;margin-bottom:10px;
}
.feedback.show{display:block}
.feedback.ok{background:#D1FAE5;color:#065F46}
.feedback.no{background:#FEE2E2;color:#991B1B}

/* Buttons */
.btn-row{display:flex;gap:12px;justify-content:center}
.btn{
  padding:16px 36px;border:none;border-radius:14px;
  font-size:18px;font-weight:700;cursor:pointer;transition:all 0.15s;
  font-family:'Microsoft YaHei','Segoe UI',sans-serif;
}
.btn-next{background:#DB2777;color:#fff;display:none}
.btn-next.show{display:inline-block}
.btn-restart{background:#2563EB;color:#fff;display:none}
.btn-restart.show{display:inline-block}
.btn:active{transform:scale(0.95)}

/* Done */
.done-wrap{display:none;text-align:center}
.done-wrap.show{display:block}
.done-wrap .trophy{font-size:64px}
.done-wrap h2{color:#059669;margin:8px 0;font-size:22px}
.done-wrap .big-time{font-size:44px;font-weight:900;color:#2563EB;font-family:'Courier New',monospace}
.done-wrap .detail{color:#64748B;margin:6px 0 16px;font-size:16px}
.done-wrap table{width:100%;border-collapse:collapse;margin-bottom:14px}
.done-wrap th{color:#64748B;font-size:13px;padding:10px 8px;border-bottom:2px solid #E2E8F0}
.done-wrap td{padding:10px 8px;border-bottom:1px solid #E2E8F0;font-size:16px}
.done-wrap .r-ok{color:#059669}
.done-wrap .r-no{color:#DC2626}

.link-row{margin-top:12px;text-align:center}
.link-row a{
  display:inline-block;padding:6px 14px;border-radius:8px;
  border:2px solid #E2E8F0;background:#fff;font-size:13px;
  font-weight:600;text-decoration:none;color:#475569;margin:0 4px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">ADVERB QUIZ</div>
    <h2>📝 乘务场景 · 副词二选一</h2>
  </div>

  <!-- BIG STOPWATCH -->
  <div class="stopwatch-block">
    <div class="label">⏱ TIMER</div>
    <div class="time" id="stopwatch">00:00</div>
  </div>

  <!-- Progress -->
  <div class="progress-row">
    <span class="progress-num" id="progNum">1 / 3</span>
    <div id="progressDots" style="display:flex;gap:5px"></div>
  </div>

  <!-- Question -->
  <div class="q-box">
    <div class="context" id="context"></div>
    <div class="sentence" id="sentence"></div>
  </div>

  <!-- Choices -->
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>

  <div class="btn-row">
    <button class="btn btn-next" id="btnNext" onclick="nextQ()">下一题 →</button>
    <button class="btn btn-restart" id="btnRestart" onclick="location.reload()">🔄 再来一次</button>
  </div>

  <!-- Done -->
  <div class="done-wrap" id="doneWrap">
    <div class="trophy">🏆</div>
    <h2>Quiz Complete!</h2>
    <div class="big-time" id="doneTime"></div>
    <div class="detail" id="doneMsg"></div>
    <table id="reviewTable"></table>
  </div>

  <div class="link-row">
    <a href="adverb-training.html">🎙 发音训练</a>
    <a href="index.html">🏠 主页</a>
  </div>
</div>

<script>
var quizData = [
  {
    context:'A passenger keeps asking about ticket prices, discounts, transfer times, seat types, and refund policies...',
    sentence:'When passengers ask <b>many questions</b> about tickets, we should answer them <span class="blank">______</span>.',
    choices:['patiently','politely'],
    answer:'patiently',
    explain:'"patiently" = 耐心地 — when facing many repeated questions, patience is the key quality for a train attendant.',
    zh:'耐心地（面对反复提问，耐心是关键）'
  },
  {
    context:'You are standing at the platform entrance. It is the first interaction passengers will have with railway staff today.',
    sentence:'When <b>greeting passengers</b> at the station, we must speak <span class="blank">______</span>.',
    choices:['politely','carefully'],
    answer:'politely',
    explain:'"politely" = 礼貌地 — the first greeting sets the tone; politeness shows respect and warmth toward passengers.',
    zh:'礼貌地（问候乘客的核心是尊重和礼貌）'
  },
  {
    context:'A full luggage rack could pose a safety risk. Every bag must be checked before departure.',
    sentence:'We need to check passengers\' luggage <span class="blank">______</span> to keep travel safe.',
    choices:['carefully','patiently'],
    answer:'carefully',
    explain:'"carefully" = 仔细地 — safety inspections require thoroughness and attention to every detail.',
    zh:'仔细地（安全检查需要细致彻底）'
  }
];

var idx = 0, answered = false, timerSec = 0, timerId = null, qStartTime = 0, results = [];

function pad(n){ return n<10?'0'+n:''+n; }

function buildProgress() {
  var html = '';
  for (var i = 0; i < quizData.length; i++) {
    var cls = 'progress-dot';
    if (i < idx) {
      var r = results[i];
      cls += r.correct ? ' done' : ' wrong';
    } else if (i === idx) cls += ' cur';
    html += '<span class="' + cls + '"></span>';
  }
  document.getElementById('progressDots').innerHTML = html;
  document.getElementById('progNum').textContent = (idx+1) + ' / ' + quizData.length;
}

function updateStopwatch() {
  var m = Math.floor(timerSec / 60);
  var s = timerSec % 60;
  document.getElementById('stopwatch').textContent = pad(m) + ':' + pad(s);
}

function startStopwatch() {
  qStartTime = Date.now();
  timerSec = 0;
  document.getElementById('stopwatch').className = 'time running';
  updateStopwatch();
  timerId = setInterval(function() {
    timerSec++;
    updateStopwatch();
  }, 1000);
}

function stopStopwatch() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  document.getElementById('stopwatch').className = 'time';
}

function selectChoice(choiceText) {
  if (answered) return;
  answered = true;
  stopStopwatch();
  var elapsed = (Date.now() - qStartTime) / 1000;
  var q = quizData[idx];
  var isCorrect = choiceText === q.answer;

  var buttons = document.querySelectorAll('.choice');
  buttons.forEach(function(b) {
    b.style.pointerEvents = 'none';
    if (b.textContent === q.answer) b.classList.add('correct');
    if (b.textContent === choiceText && !isCorrect) b.classList.add('wrong');
  });

  var fb = document.getElementById('feedback');
  if (isCorrect) {
    fb.className = 'feedback show ok';
    fb.innerHTML = '✅ <strong>Correct!</strong> ' + q.explain;
  } else {
    fb.className = 'feedback show no';
    fb.innerHTML = '❌ <strong>' + choiceText + '</strong> is not right. ' + q.explain;
  }
  document.getElementById('btnNext').classList.add('show');
  results.push({ q: q, userChoice: choiceText, correct: isCorrect, elapsed: elapsed });
}

function nextQ() {
  idx++;
  if (idx >= quizData.length) { showDone(); return; }
  answered = false;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btnNext').classList.remove('show');
  renderQ();
  buildProgress();
}

function renderQ() {
  var q = quizData[idx];
  document.getElementById('context').textContent = '🚂 ' + q.context;
  document.getElementById('sentence').innerHTML = q.sentence;
  var html = '';
  q.choices.forEach(function(c) {
    html += '<button class="choice" onclick="selectChoice(\'' + c + '\')">' + c + '</button>';
  });
  document.getElementById('choices').innerHTML = html;
  startStopwatch();
}

function fmtTime(sec) {
  var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return pad(m) + ':' + pad(s);
}

function showDone() {
  document.querySelector('.q-box').style.display = 'none';
  document.getElementById('choices').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('btnNext').classList.remove('show');
  document.getElementById('btnRestart').classList.add('show');
  document.querySelector('.stopwatch-block').style.display = 'none';

  var correctCount = results.filter(function(r){return r.correct;}).length;
  var totalTime = results.reduce(function(s,r){return s + r.elapsed;}, 0);

  document.getElementById('doneTime').textContent = '⏱ Total: ' + fmtTime(totalTime);
  document.getElementById('doneMsg').innerHTML = 'Correct: <strong>' + correctCount + ' / ' + quizData.length + '</strong>';

  var tableHtml = '<tr><th>#</th><th>Your Choice</th><th>Answer</th><th>Time</th></tr>';
  results.forEach(function(r, i) {
    var icon = r.correct ? '✅' : '❌';
    var cls = r.correct ? 'r-ok' : 'r-no';
    tableHtml += '<tr><td>' + icon + '</td><td class="' + cls + '"><strong>' + r.userChoice + '</strong></td><td style="color:#2563EB;font-weight:700;">' + r.q.answer + '</td><td style="color:#64748B;">' + fmtTime(r.elapsed) + '</td></tr>';
  });
  document.getElementById('reviewTable').innerHTML = tableHtml;
  document.getElementById('doneWrap').classList.add('show');
}

buildProgress();
renderQ();
</script>
</body>
</html>

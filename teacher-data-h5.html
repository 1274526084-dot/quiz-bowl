<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>教师数据看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue','Microsoft YaHei',sans-serif;background:#f1f5f9;min-height:100vh;padding:12px}
.container{max-width:960px;margin:0 auto}
.header{background:linear-gradient(135deg,#1e40af,#3b82f6);padding:18px;border-radius:14px;color:#fff;text-align:center;margin-bottom:12px}.header h2{font-size:19px}.header p{font-size:11px;opacity:0.7}
.auth-box{background:#fff;border-radius:14px;padding:24px;max-width:360px;margin:40px auto;text-align:center;border:2px solid #e2e8f0}.auth-box input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;text-align:center;margin:8px 0}.btn{padding:12px 20px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}.btn-auth{width:100%;background:#2563eb;color:#fff}.btn-refresh{background:#16a34a;color:#fff}.btn-outline{background:#fff;color:#2563eb;border:1.5px solid #2563eb}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat-card{background:#fff;border-radius:10px;padding:14px 10px;text-align:center;border:1.5px solid #e2e8f0}.stat-num{font-size:28px;font-weight:900;color:#1e293b;display:block}.stat-label{font-size:11px;color:#94a3b8;margin-top:4px}
.toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}.toolbar input{padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;flex:1;min-width:80px;background:#fff}.refreshed{font-size:11px;color:#94a3b8;white-space:nowrap}

/* Student cards */
.student-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.s-card{background:#fff;border-radius:12px;padding:14px 16px;border:1.5px solid #e2e8f0;cursor:pointer}.s-card:active{background:#f8fafc}
.s-card .s-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.s-name{font-size:16px;font-weight:700;color:#1e293b}.s-id{font-size:11px;color:#94a3b8}.s-tag{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}.s-tag-active{background:#f0fdf4;color:#16a34a}
.s-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin-bottom:8px}
.s-metric .sm-num{font-size:20px;font-weight:800;color:#2563eb;display:block}.s-metric .sm-lbl{font-size:10px;color:#94a3b8;margin-top:2px}
.s-recent{font-size:11px;color:#94a3b8}.s-recent b{color:#475569}
.s-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #e2e8f0}.s-detail.show{display:block}
.s-detail h4{font-size:13px;color:#475569;margin:8px 0 4px}
.detail-item{font-size:11px;color:#64748b;padding:3px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between}
.detail-item .di-left{flex:1}.detail-item .di-time{color:#94a3b8;font-size:10px}

.export-row{text-align:right;padding:8px 0}.export-row button{margin-left:6px}
.table-wrap{background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid #e2e8f0;max-height:400px;overflow-y:auto;display:none}.table-wrap.show{display:block}
table{width:100%;border-collapse:collapse;font-size:11px}th{background:#f8fafc;padding:5px 3px;text-align:center;color:#64748b;font-size:10px;border-bottom:2px solid #e2e8f0;position:sticky;top:0}td{padding:4px 3px;text-align:center;color:#475569;border-bottom:1px solid #f1f5f9}tr:hover{background:#f8fafc}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}.s-metrics{grid-template-columns:repeat(3,1fr)}}
</style>
</head><body><div class="container" id="app">
<div class="auth-box" id="authBox"><h3>🔐 教师验证</h3><p style="color:#94a3b8;font-size:13px;margin-bottom:10px">请输入口令</p><input type="password" id="pwd" placeholder="口令"><button class="btn btn-auth" onclick="auth()">验证进入</button></div>
<div id="dashboard" style="display:none">
<div class="header"><h2>📊 马来西亚学生 · 学习档案总览</h2><p>信号班中文学习记录 · projectId=ECRL_MY_CHINESE</p></div>
<div class="stats-row">
  <div class="stat-card"><span class="stat-num" id="sTotal">0</span><span class="stat-label">学生总数</span></div>
  <div class="stat-card"><span class="stat-num" id="sToday">0</span><span class="stat-label">今日提交</span></div>
  <div class="stat-card"><span class="stat-num" id="sExt">0</span><span class="stat-label">总拓展次数</span></div>
  <div class="stat-card"><span class="stat-num" id="sSubs">0</span><span class="stat-label">总提交记录</span></div>
</div>
<div class="toolbar">
  <input type="text" id="filterSearch" placeholder="搜索学生编号/姓名..." oninput="renderStudents()">
  <button class="btn btn-refresh" onclick="loadData()">🔄 刷新</button>
  <span class="refreshed" id="refreshTime"></span>
  <button class="btn btn-outline" onclick="toggleRawTable()">📋 原始数据</button>
  <button class="btn btn-outline" onclick="toggleStudentMgmt()">👥 账号管理</button>
  <button class="btn btn-outline" onclick="exportExcel()">📤 导出Excel</button>
</div>
<div id="studentMgmt" style="display:none;background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;border:1.5px solid #e2e8f0"><h3 style="font-size:15px;margin-bottom:10px">👥 学生账号管理</h3><div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><input id="newEn" placeholder="英文名" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;margin:3px 0;font-size:13px"><input id="newCn" placeholder="中文名" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;margin:3px 0;font-size:13px"><input id="newSid" placeholder="学生编号 如MY001" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;margin:3px 0;font-size:13px"><button class="btn btn-refresh" onclick="createStudent()" style="width:100%;margin-top:4px;font-size:12px">✅ 新增</button></div><div style="flex:1;min-width:180px;background:#f8fafc;border-radius:10px;padding:12px"><label style="font-size:11px;color:#64748b;font-weight:600">批量生成</label><input id="batchCount" value="3" type="number" min="1" max="50" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;margin:8px 0"><label style="font-size:10px;color:#94a3b8">自动编号 MY001 / MY002 / ...</label><button class="btn btn-refresh" onclick="batchCreate()" style="width:100%;margin-top:6px;font-size:12px">⚡ 批量生成</button></div></div>
<div style="background:#f0fdf4;border-radius:8px;padding:12px;margin-bottom:8px"><h4 style="font-size:13px;color:#16a34a;margin-bottom:6px">📤 上传学生名单 Excel/CSV</h4><label style="font-size:11px;color:#64748b">文件格式：第一列英文名，第二列中文名（不要表头）</label>
  <input type="file" id="uploadFile" accept=".csv,.txt" onchange="handleFileUpload()" style="margin:8px 0;font-size:12px">
  <p style="font-size:10px;color:#94a3b8">请用记事本保存为 .csv 文件（UTF-8编码）。Excel直接另存为CSV。</p>
  <div id="uploadPreview" style="font-size:11px;max-height:100px;overflow-y:auto;margin:6px 0"></div>
  <button class="btn btn-refresh" onclick="batchUploadCreate()" style="width:100%;font-size:12px">⚡ 上传并批量生成</button>
  <p style="font-size:10px;color:#94a3b8;margin-top:6px">起始编号</p>
  <input id="startId" value="MY004" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;margin-bottom:6px;font-size:13px">
  <p style="font-size:10px;color:#94a3b8;margin-top:6px">粘贴学生名单（一行一个：英文名,中文名）</p>
  <textarea id="pasteArea" placeholder="Ahmad,陈小明&#10;Siti,黄小丽&#10;Ravi,李小华" style="width:100%;min-height:100px;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;margin-top:4px;resize:vertical"></textarea>
  <button class="btn btn-refresh" id="pastePreviewBtn" onclick="previewRoster()" style="width:100%;margin-top:6px;font-size:12px">⚡ 预览名单</button>
  <div id="rosterPreview" style="display:none;margin-top:8px;border:1px solid #e2e8f0;border-radius:8px;padding:10px;max-height:200px;overflow-y:auto;font-size:11px"></div>
  <div id="rosterActions" style="display:none;margin-top:6px;display:flex;gap:8px">
    <button class="btn btn-refresh" onclick="confirmGenerate()" style="flex:1;font-size:12px">✅ 确认生成</button>
    <button class="btn btn-outline" onclick="cancelPreview()" style="flex:1;font-size:12px">← 返回修改</button>
  </div>
</div></div></div><div id="studentList" style="font-size:11px;max-height:150px;overflow-y:auto;margin-top:6px"></div></div>

<div class="student-grid" id="studentGrid"><div style="text-align:center;padding:30px;color:#94a3b8">加载中...</div></div>
<div class="table-wrap" id="rawTable"><table><thead><tr><th>姓名</th><th>编号</th><th>UID</th><th>类型</th><th>标题</th><th>选词</th><th>句子</th><th>时间</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div></div>
<script>
var API='https://cloudbase-d3gxxe4l88c3d5907.service.tcloudbase.com/task4Api';
var allData=[],refreshTimer=null;

function auth(){if(document.getElementById('pwd').value==='ECRL2026'){document.getElementById('authBox').style.display='none';document.getElementById('dashboard').style.display='block';loadData();refreshTimer=setInterval(loadData,30000);}else{alert('口令错误');}}
function fmtTime(t){if(!t)return'—';var d=new Date(t);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}

function loadData(){
  var cb='_t_'+Date.now();window[cb]=function(res){if(res&&res.data){allData=res.data.filter(function(r){return r.projectId==='ECRL_MY_CHINESE'&&r.schemaVersion===2;});}updateStats();renderStudents();renderRawTable();document.getElementById('refreshTime').textContent='刷新于 '+new Date().toLocaleTimeString('zh-CN');delete window[cb];};
  var s=document.createElement('script');s.src=API+'?callback='+cb+'&action=list';document.head.appendChild(s);setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},6000);
}

function updateStats(){
  var today=new Date().toISOString().split('T')[0];var uids={},extCount=0,todayCount=0,seen={};
  allData=allData.filter(function(r){var k=r.submissionId||(r.studentId+'_'+r.dataType);if(seen[k])return false;seen[k]=true;return true;});
  allData.forEach(function(r){var u=r.studentUid||r.studentId||'';if(u)uids[u]=true;if(r.dataType==='extension_record')extCount++;if((r.submitTime||'').indexOf(today)!==-1||(r.serverTime||'').indexOf(today)!==-1)todayCount++;});
  document.getElementById('sTotal').textContent=Object.keys(uids).length;document.getElementById('sToday').textContent=todayCount;document.getElementById('sExt').textContent=extCount;document.getElementById('sSubs').textContent=allData.length;
}

function renderStudents(){
  var search=(document.getElementById('filterSearch').value||'').toLowerCase();var profiles={};
  allData.forEach(function(r){var uid=r.studentUid||r.studentId||r.name;if(!uid)return;if(!profiles[uid])profiles[uid]={uid:uid,studentId:r.studentId||'',name:r.studentName||r.name||'',chineseName:r.chineseName||'',extCount:0,courseCount:0,lastTime:'',records:[],words:[]};var p=profiles[uid];if(r.dataType==='extension_record'){p.extCount++;if(r.selectedWord)p.words.push(r.selectedWord);}if((r.submitTime||'')>(p.lastTime||''))p.lastTime=r.submitTime||r.serverTime||p.lastTime;p.records.push(r);});
  var list=[];for(var k in profiles){var p=profiles[k];if(search&&p.studentId.toLowerCase().indexOf(search)===-1&&p.name.toLowerCase().indexOf(search)===-1&&(p.chineseName||'').toLowerCase().indexOf(search)===-1)continue;list.push(p);}
  list.sort(function(a,b){return b.extCount-a.extCount;});
  var h='';list.forEach(function(p,i){
    h+='<div class="s-card" onclick="toggleDetail(\'sdetail'+i+'\')"><div class="s-top"><div><span class="s-name">'+(p.chineseName||p.name)+'</span><span class="s-id"> '+p.studentId+'</span></div><span class="s-tag s-tag-active">● 学习中</span></div>';
    h+='<div class="s-metrics"><div class="s-metric"><span class="sm-num">'+p.extCount+'</span><span class="sm-lbl">拓展次数</span></div><div class="s-metric"><span class="sm-num">'+p.courseCount+'</span><span class="sm-lbl">课程任务</span></div><div class="s-metric"><span class="sm-num">'+p.records.length+'</span><span class="sm-lbl">提交记录</span></div><div class="s-metric"><span class="sm-num">'+(p.words.length||0)+'</span><span class="sm-lbl">新词收藏</span></div></div>';
    h+='<div class="s-recent">最近学习：<b>'+fmtTime(p.lastTime)+'</b></div>';
    h+='<div class="s-detail" id="sdetail'+i+'"><h4>📋 最近提交记录</h4>';
    p.records.slice(-5).reverse().forEach(function(r){h+='<div class="detail-item"><span class="di-left">'+(r.dataType==='extension_record'?'🌱拓展':'📝任务')+' '+ (r.extensionTitle||r.taskTitle||'')+'</span><span class="di-time">'+fmtTime(r.serverTime||r.submitTime)+'</span></div>';});
    if(p.words.length>0){h+='<h4>📝 收藏的新词</h4><div style="display:flex;flex-wrap:wrap;gap:4px">';var uw={};p.words.forEach(function(w){if(!uw[w]){uw[w]=true;h+='<span style="background:#eff6ff;color:#2563eb;padding:2px 8px;border-radius:8px;font-size:11px">'+w+'</span>';}});h+='</div>';}
    h+='<h4>🆔 studentUid</h4><span style="font-size:10px;color:#94a3b8">'+p.uid+'</span></div></div>';
  });
  document.getElementById('studentGrid').innerHTML=h||'<div style="text-align:center;padding:30px;color:#94a3b8">暂无数据</div>';
}

function toggleDetail(id){var el=document.getElementById(id);if(el)el.classList.toggle('show');}
function toggleRawTable(){document.getElementById('rawTable').classList.toggle('show');}
function toggleStudentMgmt(){document.getElementById('studentMgmt').style.display=document.getElementById('studentMgmt').style.display==='none'?'block':'none';}

function createStudent(){
  var en=document.getElementById('newEn').value.trim(),cn=document.getElementById('newCn').value.trim(),sid=document.getElementById('newSid').value.trim();
  if(!sid){alert('请输入学生编号');return;}
  var cb='_cr'+Date.now();window[cb]=function(res){if(res&&res.success){alert('✅ 创建成功\n学生编号：'+res.studentId+'\n初始口令：'+res.initialPin+'\nstudentUid：'+res.studentUid);document.getElementById('newEn').value='';document.getElementById('newCn').value='';document.getElementById('newSid').value='';}else{alert('失败：'+(res&&res.error||''));}delete window[cb];};
  var s=document.createElement('script');s.src=API+'?callback='+cb+'&action=teacher_create_student&studentId='+encodeURIComponent(sid)+'&englishName='+encodeURIComponent(en)+'&chineseName='+encodeURIComponent(cn);document.head.appendChild(s);
}
var uploadStudents=[];
function handleFileUpload(){
  var file=document.getElementById('uploadFile').files[0];if(!file)return;
  var reader=new FileReader();reader.onload=function(e){
    var buffer=e.target.result;var text='';
    // Try UTF-8 first
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(buffer));}catch(_){}
    // If UTF-8 failed (garbled), try GBK (Chinese Excel default)
    if(!text||text.indexOf('�')!==-1||/[^\x00-\x7f一-鿿　-〿＀-￯]/.test(text.slice(0,200))){
      try{text=new TextDecoder('gbk').decode(new Uint8Array(buffer));}catch(_){try{text=new TextDecoder('gb2312').decode(new Uint8Array(buffer));}catch(_){}}
    }
    if(!text||text.length<3){document.getElementById('uploadPreview').innerHTML='文件为空或无法识别编码';return;}
    var lines=text.split(/[\r\n]+/).filter(function(l){return l.trim();});
    uploadStudents=[];var preview='';var startId=document.getElementById('startId').value.trim()||'MY001';var startNum=parseInt(startId.replace(/\D/g,''))||1;
    lines.forEach(function(line,i){
      var cols=line.split(/[,;\t]/).map(function(c){return c.trim();});
      if(cols.length>=1&&cols[0]&&i<100){
        uploadStudents.push({englishName:cols[0]||'',chineseName:cols[1]||''});
        var sid='MY'+String(startNum+i).padStart(3,'0');
        preview+='<div>'+sid+' · '+cols[0]+(cols[1]?' · '+cols[1]:'')+'</div>';
      }
    });
    document.getElementById('uploadPreview').innerHTML=preview||'未识别到数据（请检查格式：英文名,中文名）';
  };
  reader.readAsArrayBuffer(file);
}
function parseRoster(rawText){
  var text=(rawText||'').replace(/\r\n?/g,'\n').trim();if(!text)return[];
  var lines=text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
  var students=[],errors=[];
  lines.forEach(function(line,i){
    var cols=line.split(/[,，;\t]/).map(function(c){return c.trim();});
    if(cols.length>=1&&cols[0]){
      var en=cols[0],cn=cols[1]||'';
      // Skip header row
      if((en==='英文名'||en==='englishName'||en==='English Name')&&i===0)return;
      students.push({englishName:en,chineseName:cn,line:i+1});
    }else{errors.push(i+1);}
    console.log('Roster line '+(i+1)+':',cols[0],cols[1]);
  });
  console.log('Parsed '+students.length+' students, '+errors.length+' errors');
  return {students:students,errors:errors,total:lines.length};
}

var pendingRoster=[];
function previewRoster(){
  try{
    var textarea=document.getElementById('pasteArea');
    if(!textarea){alert('错误：未找到粘贴框');return;}
    var rawText=textarea.value;
    if(!rawText.trim()){alert('请先粘贴学生名单。');return;}
    var result=parseRoster(rawText);
    if(!result.students.length){alert('解析到0个学生，请检查格式。');return;}
    pendingRoster=result.students;
    var startId=document.getElementById('startId').value.trim()||'MY001';var startNum=parseInt(startId.replace(/\D/g,''))||1;
    var html='<div style="font-weight:700;margin-bottom:6px">📋 共识别 '+result.students.length+' 名学生</div>';
    html+='<div style="font-size:10px;color:#94a3b8;margin-bottom:6px">从 MY'+String(startNum).padStart(3,'0')+' 开始编号</div>';
    result.students.forEach(function(s,i){html+='<div style="padding:2px 0">MY'+String(startNum+i).padStart(3,'0')+' · '+s.englishName+(s.chineseName?' · '+s.chineseName:'')+'</div>';});
    document.getElementById('rosterPreview').innerHTML=html;document.getElementById('rosterPreview').style.display='block';document.getElementById('rosterActions').style.display='flex';
  }catch(e){alert('错误：'+e.message);}
}
function cancelPreview(){pendingRoster=[];document.getElementById('rosterPreview').style.display='none';document.getElementById('rosterActions').style.display='none';}
function confirmGenerate(){
  if(!pendingRoster.length){alert('没有待生成的学生');return;}
  uploadStudents=pendingRoster;batchUploadCreate();
  document.getElementById('rosterActions').style.display='none';
  document.getElementById('rosterPreview').innerHTML+='<div style="color:#2563eb;margin-top:6px">⏳ 正在生成账号...</div>';
}

function batchUploadCreate(){
  if(!uploadStudents.length){alert('请先上传文件');return;}
  var results=[];var total=uploadStudents.length;
  function next(i){if(i>=total){downloadResults(results);return;}
    var startId=document.getElementById('startId').value.trim()||'MY001';var startNum=parseInt(startId.replace(/\D/g,''))||1;var stu=uploadStudents[i];var sid='MY'+String(startNum+i).padStart(3,'0');
    var cb='_ul'+Date.now()+'_'+i;window[cb]=function(res){
      if(res&&res.success){results.push({studentId:sid,englishName:stu.englishName,chineseName:stu.chineseName,initialPin:res.initialPin,studentUid:res.studentUid});}
      else{results.push({studentId:sid,englishName:stu.englishName,chineseName:stu.chineseName,initialPin:'FAILED',studentUid:''});}
      next(i+1);delete window[cb];
    };
    var s=document.createElement('script');s.src=API+'?callback='+cb+'&action=teacher_create_student&studentId='+encodeURIComponent(sid)+'&englishName='+encodeURIComponent(stu.englishName)+'&chineseName='+encodeURIComponent(stu.chineseName)+'&className=马来西亚学生中文学习班';document.head.appendChild(s);
  }next(0);
}
function downloadResults(list){
  var csv='﻿学生编号,英文名,中文名,初始口令,studentUid\n';list.forEach(function(r){csv+=r.studentId+','+r.englishName+','+r.chineseName+','+r.initialPin+','+r.studentUid+'\n';});
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='学生账号表_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  alert('✅ 已生成 '+list.filter(function(r){return r.initialPin!=='FAILED';}).length+'/'+list.length+' 个账号\n文件已自动下载');
}

function batchCreate(){
  var count=parseInt(document.getElementById('batchCount').value)||3;var startId=document.getElementById('startId').value.trim()||'MY001';var startNum=parseInt(startId.replace(/\D/g,''))||1;var created=0;
  function next(i){if(i>count){alert('✅ 已生成'+created+'个账号');return;}
    var num=startNum+i-1;var sid='MY'+String(num).padStart(3,'0');var cb='_ba'+Date.now()+'_'+i;window[cb]=function(res){if(res&&res.success)created++;next(i+1);delete window[cb];};
    var s=document.createElement('script');s.src=API+'?callback='+cb+'&action=teacher_create_student&studentId='+sid+'&className=马来西亚学生中文学习班';document.head.appendChild(s);
  }next(1);
}

function renderRawTable(){
  var rows='';allData.slice(-30).reverse().forEach(function(r){rows+='<tr><td>'+(r.studentName||r.name||'—')+'</td><td style="font-size:10px">'+(r.studentId||'—')+'</td><td style="font-size:9px;color:#94a3b8">'+(r.studentUid||'—').slice(0,12)+'</td><td>'+(r.dataType==='extension_record'?'🌱拓展':'📝')+'</td><td>'+(r.extensionTitle||'—')+'</td><td>'+(r.selectedWord||'—')+'</td><td style="font-size:10px">'+(r.studentSentence||'—').slice(0,20)+'</td><td style="font-size:10px">'+fmtTime(r.serverTime||r.submitTime)+'</td></tr>';});
  document.getElementById('tbody').innerHTML=rows||'<tr><td colspan="8" style="padding:20px;color:#94a3b8">暂无</td></tr>';
}

function exportExcel(){var BOM='﻿';var csv='studentId,studentName,studentUid,dataType,extensionTitle,selectedWord,studentSentence,serverTime\n';allData.forEach(function(r){csv+=[r.studentId||'',r.studentName||r.name||'',r.studentUid||'',r.dataType||'',r.extensionTitle||'',r.selectedWord||'',(r.studentSentence||'').replace(/"/g,'""'),r.serverTime||r.submitTime||''].join(',')+'\n';});var blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='马来西亚学生数据_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);}
</script></body></html>

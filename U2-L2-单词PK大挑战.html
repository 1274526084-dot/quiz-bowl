<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>U2-L2 单词PK大挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; min-height: 100vh; overflow-x: hidden;
  }

  /* ---- Welcome Screen ---- */
  .screen { display: none; min-height: 100vh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .welcome-bg {
    background: linear-gradient(135deg, #0f0c29, #1a1a2e 40%, #16213e 70%, #0f3460 100%);
  }
  .train-icon { font-size: 64px; margin-bottom: 16px; animation: slideRight 2s ease-in-out infinite; }
  @keyframes slideRight { 0%,100%{transform:translateX(0);} 50%{transform:translateX(12px);} }

  .title {
    font-size: 32px; font-weight: 900; color: #fff; text-align: center;
    text-shadow: 0 0 30px rgba(230,180,34,0.6); margin-bottom: 8px;
  }
  .title .gold { color: #e6b422; }
  .subtitle {
    font-size: 14px; color: #8892b0; text-align: center; margin-bottom: 32px; line-height: 1.6;
  }
  .btn-start {
    background: linear-gradient(135deg, #e6b422, #f0c040);
    color: #1a1a2e; border: none; border-radius: 50px; padding: 16px 56px;
    font-size: 20px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 30px rgba(230,180,34,0.4);
    transition: all 0.2s; -webkit-tap-highlight-color: transparent;
  }
  .btn-start:active { transform: scale(0.95); opacity: 0.9; }

  .stats-preview { display: flex; gap: 24px; margin-top: 28px; }
  .stat-item { text-align: center; color: #8892b0; font-size: 12px; }
  .stat-item span { display: block; color: #e6b422; font-size: 22px; font-weight: 700; }

  /* ---- Game Screen ---- */
  .game-bg { background: #16213e; }
  .game-header {
    width: 100%; max-width: 600px; display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 20px;
  }
  .round-info { color: #8892b0; font-size: 13px; }
  .round-info b { color: #e6b422; }
  .score-live { color: #fff; font-size: 18px; font-weight: 700; }
  .score-live span { color: #4ecca3; font-size: 28px; }

  .timer-bar-wrap {
    width: 100%; max-width: 600px; height: 6px; background: #2a2a4a;
    border-radius: 3px; margin-bottom: 24px; overflow: hidden;
  }
  .timer-bar {
    height: 100%; background: #4ecca3; border-radius: 3px;
    transition: width 0.1s linear; width: 100%;
  }
  .timer-bar.warning { background: #f39c12; }
  .timer-bar.danger { background: #e74c3c; }

  .sentence-card {
    width: 100%; max-width: 600px; background: #1e2a4a;
    border-radius: 16px; padding: 24px 20px; margin-bottom: 24px;
    border: 1px solid #2a3a5a; text-align: center;
  }
  .sentence-context {
    font-size: 12px; color: #e6b422; margin-bottom: 8px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .sentence-text {
    font-size: 18px; color: #ccd6f6; line-height: 1.7; font-weight: 500;
  }
  .sentence-text .blank {
    display: inline-block; background: #2a3a5a; color: #e6b422;
    border-radius: 6px; padding: 2px 12px; min-width: 60px;
    border-bottom: 2px dashed #e6b422; font-weight: 700;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .options-grid {
    width: 100%; max-width: 600px; display: grid;
    grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .opt-btn {
    background: #1e2a4a; border: 2px solid #2a3a5a; border-radius: 12px;
    padding: 14px 12px; color: #ccd6f6; font-size: 15px; font-weight: 600;
    cursor: pointer; text-align: center; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent; word-break: break-all;
  }
  .opt-btn:active { transform: scale(0.96); }
  .opt-btn.correct { background: #1a3a2a; border-color: #4ecca3; color: #4ecca3; animation: pop 0.3s; }
  .opt-btn.wrong { background: #3a1a1a; border-color: #e74c3c; color: #e74c3c; animation: shake 0.4s; }
  .opt-btn.reveal { background: #1a2a3a; border-color: #4ecca3; color: #4ecca3; }
  .opt-btn.disabled { pointer-events: none; opacity: 0.6; }
  @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .feedback-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 48px; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity 0.2s;
  }
  .feedback-toast.show { opacity: 1; }

  /* ---- Result Screen ---- */
  .result-bg { background: #0f0c29; }
  .result-card {
    background: #16213e; border-radius: 20px; padding: 32px 24px;
    text-align: center; max-width: 400px; width: 100%;
    border: 1px solid #2a3a5a;
  }
  .result-emoji { font-size: 64px; margin-bottom: 12px; }
  .result-score { font-size: 56px; font-weight: 900; color: #e6b422; }
  .result-label { font-size: 14px; color: #8892b0; margin-bottom: 20px; }
  .result-grade { font-size: 18px; font-weight: 700; color: #4ecca3; margin-bottom: 8px; }
  .result-detail { font-size: 13px; color: #8892b0; margin-bottom: 24px; line-height: 1.8; }
  .btn-restart {
    background: #e6b422; color: #1a1a2e; border: none; border-radius: 50px;
    padding: 14px 48px; font-size: 16px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-restart:active { transform: scale(0.95); }

  /* ---- Combo indicator ---- */
  .combo-pop {
    position: fixed; top: 30%; right: 20px; color: #e6b422; font-weight: 900;
    font-size: 18px; z-index: 50; pointer-events: none; opacity: 0;
    transition: all 0.3s; transform: translateY(10px);
  }
  .combo-pop.fire { opacity: 1; transform: translateY(-10px); }
</style>
</head>
<body>

<!-- ====== WELCOME ====== -->
<div class="screen active welcome-bg" id="welcomeScreen">
  <div class="train-icon">🚄</div>
  <div class="title">单词<span class="gold">PK</span>大挑战</div>
  <div class="subtitle">
    U2-L2 新生词 · 铁路场景英语<br>
    15轮挑战 · 看句子选单词
  </div>
  <button class="btn-start" onclick="startGame()">开始挑战</button>
  <div class="stats-preview">
    <div class="stat-item"><span>15</span> 单词</div>
    <div class="stat-item"><span>10s</span> 每题限时</div>
    <div class="stat-item"><span>✕2</span> 连续答对加分</div>
  </div>
</div>

<!-- ====== GAME ====== -->
<div class="screen game-bg" id="gameScreen">
  <div class="game-header">
    <div class="round-info">第 <b id="roundNum">1</b>/15 题</div>
    <div class="score-live"><span id="liveScore">0</span> 分</div>
  </div>
  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar"></div>
  </div>
  <div class="sentence-card">
    <div class="sentence-context" id="contextLabel">铁路维护场景</div>
    <div class="sentence-text" id="sentenceText"></div>
  </div>
  <div class="options-grid" id="optionsGrid"></div>
  <div class="feedback-toast" id="feedbackToast"></div>
  <div class="combo-pop" id="comboPop"></div>
</div>

<!-- ====== RESULT ====== -->
<div class="screen result-bg" id="resultScreen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-label">总分</div>
    <div class="result-grade" id="resultGrade"></div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="btn-restart" onclick="restartGame()">再来一局</button>
  </div>
</div>

<script>
// ---- 15 railway-themed sentences (one per word) ----
var QUESTIONS = [
  {
    sentence: "The mechanic had to <span class='blank'>___</span> that he forgot to check the brake system.",
    answer: "admit",
    context: "车辆维修场景"
  },
  {
    sentence: "The safety <span class='blank'>___</span> inspected the new signaling equipment at the station.",
    answer: "advisor",
    context: "安全检查场景"
  },
  {
    sentence: "The <span class='blank'>___</span> young engineer wants to redesign the entire maintenance workflow.",
    answer: "ambitious",
    context: "技术创新场景"
  },
  {
    sentence: "Each <span class='blank'>___</span> for the train driver position must pass a strict health examination.",
    answer: "candidate",
    context: "招聘选拔场景"
  },
  {
    sentence: "The chief inspector made a positive <span class='blank'>___</span> about the clean engine room.",
    answer: "comment",
    context: "质量检查场景"
  },
  {
    sentence: "Every repair procedure must be <span class='blank'>___</span>ed in the maintenance logbook.",
    answer: "document",
    context: "维修记录场景"
  },
  {
    sentence: "Heavy snowfall can have a serious <span class='blank'>___</span> on the railway timetable.",
    answer: "impact",
    context: "极端天气场景"
  },
  {
    sentence: "The railway company will <span class='blank'>___</span> free technical training to all new employees.",
    answer: "offer",
    context: "员工培训场景"
  },
  {
    sentence: "A well-<span class='blank'>___</span> maintenance team can repair the electric multiple unit much faster.",
    answer: "organized",
    context: "动车维修场景"
  },
  {
    sentence: "The <span class='blank'>___</span> of the new high-speed train has exceeded all expectations.",
    answer: "performance",
    context: "高铁性能场景"
  },
  {
    sentence: "We need to set a <span class='blank'>___</span> timeline for the track replacement project.",
    answer: "realistic",
    context: "轨道施工场景"
  },
  {
    sentence: "Passenger safety is the primary <span class='blank'>___</span> of every crew member on board.",
    answer: "responsibility",
    context: "客运安全场景"
  },
  {
    sentence: "Engineers discovered a structural <span class='blank'>___</span> in the steel bridge during routine inspection.",
    answer: "weakness",
    context: "桥梁检测场景"
  },
  {
    sentence: "The locomotive depot is a busy <span class='blank'>___</span> that operates 24 hours a day.",
    answer: "workplace",
    context: "机务段场景"
  },
  {
    sentence: "Lack of sleep can <span class='blank'>___</span> <span class='blank'>___</span> <span class='blank'>___</span> <span class='blank'>___</span> <span class='blank'>___</span> a driver's concentration and reaction speed.",
    answer: "have a negative impact on",
    context: "行车安全场景"
  }
];

var ALL_WORDS = QUESTIONS.map(function(q) { return q.answer; });
var rounds = [];
var currentRound = 0;
var score = 0;
var combo = 0;
var timerInterval = null;
var timeLeft = 0;
var answered = false;

// ---- Fisher-Yates shuffle ----
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Pick 3 wrong options distinct from answer
function pickOptions(answer) {
  var others = ALL_WORDS.filter(function(w) { return w !== answer; });
  others = shuffle(others);
  var opts = others.slice(0, 3);
  opts.push(answer);
  return shuffle(opts);
}

// ---- Start Game ----
function startGame() {
  rounds = shuffle(QUESTIONS);
  currentRound = 0;
  score = 0;
  combo = 0;

  document.getElementById("welcomeScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  document.getElementById("resultScreen").classList.remove("active");
  document.getElementById("liveScore").textContent = "0";

  loadRound();
}

// ---- Load Round ----
function loadRound() {
  if (currentRound >= rounds.length) {
    endGame();
    return;
  }

  answered = false;
  var q = rounds[currentRound];
  var options = pickOptions(q.answer);

  document.getElementById("roundNum").textContent = currentRound + 1;
  document.getElementById("sentenceText").innerHTML = q.sentence;
  document.getElementById("contextLabel").textContent = q.context;

  var grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  options.forEach(function(word) {
    var btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = word;
    btn.onclick = function() { selectAnswer(word, q.answer, btn); };
    grid.appendChild(btn);
  });

  startTimer();
}

// ---- Timer ----
function startTimer() {
  timeLeft = 10;
  updateTimerBar();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    timeLeft = Math.max(0, timeLeft - 0.1);
    updateTimerBar();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeUp();
    }
  }, 100);
}

function updateTimerBar() {
  var bar = document.getElementById("timerBar");
  var pct = (timeLeft / 10) * 100;
  bar.style.width = pct + "%";
  bar.className = "timer-bar" + (timeLeft < 3 ? " danger" : timeLeft < 5 ? " warning" : "");
}

function timeUp() {
  answered = true;
  var q = rounds[currentRound];
  combo = 0;
  revealAnswer(q.answer);
  showFeedback("⏰");
  setTimeout(nextRound, 1200);
}

// ---- Answer ----
function selectAnswer(chosen, correct, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  var allBtns = document.querySelectorAll("#optionsGrid .opt-btn");
  allBtns.forEach(function(b) { b.classList.add("disabled"); });

  if (chosen === correct) {
    combo++;
    var basePoints = 10;
    var timeBonus = timeLeft > 5 ? 5 : 0;
    var comboBonus = combo >= 5 ? 5 : combo >= 3 ? 3 : 0;
    var earned = basePoints + timeBonus + comboBonus;
    score += earned;

    btn.classList.add("correct");
    showFeedback("✅");
    if (combo >= 3) showCombo(combo);
  } else {
    combo = 0;
    btn.classList.add("wrong");
    // Highlight correct answer
    allBtns.forEach(function(b) {
      if (b.textContent === correct) b.classList.add("reveal");
    });
    showFeedback("❌");
  }

  document.getElementById("liveScore").textContent = score;
  setTimeout(nextRound, 1200);
}

function revealAnswer(correct) {
  var allBtns = document.querySelectorAll("#optionsGrid .opt-btn");
  allBtns.forEach(function(b) {
    b.classList.add("disabled");
    if (b.textContent === correct) b.classList.add("reveal");
  });
}

function showFeedback(emoji) {
  var el = document.getElementById("feedbackToast");
  el.textContent = emoji;
  el.classList.add("show");
  setTimeout(function() { el.classList.remove("show"); }, 600);
}

function showCombo(c) {
  var el = document.getElementById("comboPop");
  el.textContent = "🔥 " + c + "连对!";
  el.classList.add("fire");
  setTimeout(function() { el.classList.remove("fire"); }, 800);
}

function nextRound() {
  currentRound++;
  loadRound();
}

// ---- End Game ----
function endGame() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById("gameScreen").classList.remove("active");
  document.getElementById("resultScreen").classList.add("active");

  var maxScore = 15 * 15; // 15 questions × max 15 points each
  var pct = score / maxScore;
  var emoji, grade, detail;

  if (pct >= 0.9) {
    emoji = "🏆"; grade = "单词大师 · Word Master";
  } else if (pct >= 0.75) {
    emoji = "🥇"; grade = "优秀 · Excellent";
  } else if (pct >= 0.6) {
    emoji = "🥈"; grade = "良好 · Good Job";
  } else if (pct >= 0.4) {
    emoji = "🥉"; grade = "继续加油 · Keep Going";
  } else {
    emoji = "💪"; grade = "需要复习 · Review Needed";
  }

  var correctCount = Math.round(pct * 15);
  detail = "答对约 " + correctCount + " / 15 题<br>最高可得分: " + maxScore + " 分<br>每题 10 分基础 + 剩余时间奖励 + 连对加成";

  document.getElementById("resultEmoji").textContent = emoji;
  document.getElementById("resultScore").textContent = score;
  document.getElementById("resultGrade").textContent = grade;
  document.getElementById("resultDetail").innerHTML = detail;
}

function restartGame() {
  document.getElementById("resultScreen").classList.remove("active");
  document.getElementById("welcomeScreen").classList.add("active");
}
</script>
</body>
</html>

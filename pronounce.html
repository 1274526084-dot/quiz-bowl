<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronunciation Check · 发音评测</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #fdf2f8 0%, #eff6ff 50%, #fdf2f8 100%);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.container { max-width: 500px; width: 100%; }

.header { text-align: center; margin-bottom: 10px; }
.header .badge {
  display: inline-block; padding: 4px 16px; border-radius: 20px;
  background: #FCE7F3; color: #DB2777; font-size: 12px; font-weight: 700;
  letter-spacing: 2px; margin-bottom: 6px;
}
.header h1 { color: #2563EB; font-size: 20px; }
.header .sub { color: #64748B; font-size: 12px; }

.word-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; }
.word-tab {
  padding: 5px 12px; border-radius: 14px; border: 2px solid #E2E8F0;
  background: #fff; font-size: 12px; cursor: pointer; transition: all 0.15s;
  font-weight: 600; color: #475569; -webkit-tap-highlight-color: transparent;
}
.word-tab:active { transform: scale(0.95); }
.word-tab.active { background: #2563EB; color: #fff; border-color: #2563EB; }
.word-tab.done { border-color: #059669; background: #D1FAE5; color: #065F46; }

.card {
  background: #fff; border-radius: 18px; padding: 18px 16px 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08); text-align: center; margin-bottom: 8px;
}
.card .target-word { font-size: 30px; font-weight: 700; color: #1E293B; margin-bottom: 2px; }
.card .word-ipa { font-size: 13px; color: #94A3B8; margin-bottom: 4px; }
.card .word-zh { font-size: 14px; color: #475569; margin-bottom: 10px; }

.btn-model {
  padding: 8px 20px; border-radius: 10px; border: 2px solid #2563EB;
  background: #EFF6FF; color: #2563EB; font-size: 13px; font-weight: 600;
  cursor: pointer; margin-bottom: 10px;
}
.btn-model:active { transform: scale(0.95); }
.btn-model.playing { background: #2563EB; color: #fff; }

.btn-record {
  width: 68px; height: 68px; border-radius: 50%; border: 3px solid #DC2626;
  background: #fff; font-size: 26px; cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(220,38,38,0.2);
  margin-bottom: 4px;
}
.btn-record:active { transform: scale(0.92); }
.btn-record.recording {
  background: #DC2626; animation: pulse 1.2s infinite;
  box-shadow: 0 4px 20px rgba(220,38,38,0.4);
}
@keyframes pulse {
  0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.4)}
  50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}
}

.record-hint { font-size: 11px; color: #94A3B8; margin-bottom: 8px; }

/* Score panel */
.score-panel { display: none; margin-bottom: 6px; }
.score-panel.show { display: block; }
.score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.score-item {
  background: #F8FAFC; border-radius: 10px; padding: 8px 4px;
  text-align: center; border: 2px solid #E2E8F0;
}
.score-item .score-val { font-size: 22px; font-weight: 700; }
.score-item .score-label { font-size: 10px; color: #64748B; margin-top: 1px; }
.score-item.bad .score-val { color: #DC2626; }
.score-item.ok .score-val { color: #F59E0B; }
.score-item.good .score-val { color: #2563EB; }
.score-item.great .score-val { color: #059669; }

.overall-row {
  text-align: center; padding: 8px; border-radius: 8px;
  font-weight: 700; font-size: 14px;
}

/* Wave canvas */
#waveCanvas {
  width: 100%; height: 48px; border-radius: 8px;
  background: #F1F5F9; margin-bottom: 8px; display: none;
}
#waveCanvas.show { display: block; }

/* Playback */
.playback-row {
  display: none; align-items: center; gap: 8px; justify-content: center;
  margin-bottom: 8px;
}
.playback-row.show { display: flex; }
.btn-play {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid #2563EB;
  background: #EFF6FF; font-size: 14px; cursor: pointer;
}
.btn-play.playing { background: #2563EB; color: #fff; }

/* Stats */
.stats-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.stat-badge {
  padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
  background: #EFF6FF; color: #2563EB;
}

/* Links */
.link-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.link-row a {
  display: inline-block; padding: 6px 12px; border-radius: 8px;
  border: 2px solid #E2E8F0; background: #fff; font-size: 12px;
  font-weight: 600; text-decoration: none; color: #475569;
}
.link-row a.hl { color: #DB2777; border-color: #FBCFE8; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">ECRL VOCABULARY</div>
    <h1>🎙 Pronunciation Check</h1>
    <p class="sub">Listen to model → Record yours → Get multi-dimension score</p>
  </div>

  <div class="stats-row">
    <span class="stat-badge">✅ <strong id="doneCount">0</strong>/8</span>
    <span class="stat-badge">⭐ Avg: <strong id="avgScore">-</strong></span>
  </div>

  <div class="word-tabs" id="wordTabs"></div>

  <div class="card">
    <div class="target-word" id="targetWord"></div>
    <div class="word-ipa" id="wordIpa"></div>
    <div class="word-zh" id="wordZh"></div>

    <button class="btn-model" id="btnModel" onclick="playModel()">🔊 Listen to Model</button>
    <br>
    <button class="btn-record" id="btnRecord" onclick="toggleRecord()">🎤</button>
    <div class="record-hint" id="recordHint">Tap to record (max 4s)</div>

    <canvas id="waveCanvas" width="400" height="48"></canvas>
    <div class="playback-row" id="playbackRow">
      <button class="btn-play" id="btnPlay" onclick="playMyRecording()">▶</button>
      <span style="font-size:12px;color:#64748B;">Your recording</span>
    </div>

    <div class="score-panel" id="scorePanel">
      <div class="score-grid">
        <div class="score-item" id="scorePitch">
          <div class="score-val">-</div>
          <div class="score-label">Pitch<br>音调</div>
        </div>
        <div class="score-item" id="scoreVolume">
          <div class="score-val">-</div>
          <div class="score-label">Volume<br>音量</div>
        </div>
        <div class="score-item" id="scoreDuration">
          <div class="score-val">-</div>
          <div class="score-label">Pace<br>节奏</div>
        </div>
        <div class="score-item" id="scoreClarity">
          <div class="score-val">-</div>
          <div class="score-label">Clarity<br>清晰度</div>
        </div>
        <div class="score-item" id="scoreFluency">
          <div class="score-val">-</div>
          <div class="score-label">Fluency<br>流利度</div>
        </div>
        <div class="score-item" id="scoreOverall">
          <div class="score-val">-</div>
          <div class="score-label">Overall<br>综合</div>
        </div>
      </div>
      <div class="overall-row" id="overallMsg"></div>
    </div>
  </div>

  <div class="link-row">
    <a href="index.html" class="hl">⬅ Quiz Bowl</a>
    <a href="flashcards.html">📇 Flashcards</a>
    <a href="phonetic-analyzer.html">🔊 Phonetics</a>
  </div>
</div>

<script>
var words = [
  { word: 'attitude',    slug: 'attitude',    ipa: '/ˈætɪtjuːd/',  zh: '态度；看法' },
  { word: 'cooperate',   slug: 'cooperate',   ipa: '/kəʊˈɒpəreɪt/', zh: '合作；协作' },
  { word: 'slogan',      slug: 'slogan',      ipa: '/ˈsləʊɡən/',    zh: '口号；标语' },
  { word: 'journalist',  slug: 'journalist',  ipa: '/ˈdʒɜːnəlɪst/', zh: '新闻工作者；记者' },
  { word: 'vacancy',     slug: 'vacancy',     ipa: '/ˈveɪkənsi/',   zh: '（职位）空位；空缺' },
  { word: 'persistence', slug: 'persistence', ipa: '/pərˈsɪstəns/', zh: '坚持不懈；毅力' },
  { word: 'dress code',  slug: 'dress-code',  ipa: '/dres kəʊd/',   zh: '着装规范' },
  { word: 'dress down',  slug: 'dress-down',  ipa: '/dres daʊn/',   zh: '穿着随意' }
];

var currentIdx = 0;
var scores = {};
var isRecording = false;
var modelAudio = null;
var mediaRecorder = null;
var recordedChunks = [];
var myBlob = null;
var myBlobURL = null;
var audioCtx = null;

// Model analysis cache: { slug: { duration, rms, peaks, pitchEstimate } }
var modelProfiles = {};

function buildTabs() {
  var html = '';
  for (var i = 0; i < words.length; i++) {
    var cls = 'word-tab';
    if (i === currentIdx) cls += ' active';
    if (scores[words[i].word] && scores[words[i].word].attempts > 0) cls += ' done';
    html += '<button class="' + cls + '" onclick="switchWord(' + i + ')">' + words[i].word + '</button>';
  }
  document.getElementById('wordTabs').innerHTML = html;
}

function switchWord(i) { currentIdx = i; resetUI(); buildTabs(); renderWord(); }

function renderWord() {
  var w = words[currentIdx];
  document.getElementById('targetWord').textContent = w.word;
  document.getElementById('wordIpa').textContent = w.ipa;
  document.getElementById('wordZh').textContent = w.zh;
  buildTabs();
  updateStats();
}

function resetUI() {
  document.getElementById('scorePanel').classList.remove('show');
  document.getElementById('btnRecord').classList.remove('recording');
  document.getElementById('recordHint').textContent = 'Tap to record (max 4s)';
  document.getElementById('playbackRow').classList.remove('show');
  document.getElementById('waveCanvas').classList.remove('show');
  document.getElementById('btnPlay').classList.remove('playing');
  isRecording = false;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (myBlobURL) { URL.revokeObjectURL(myBlobURL); myBlobURL = null; }
  myBlob = null;
  recordedChunks = [];
  document.getElementById('btnModel').classList.remove('playing');
}

function resetCurrent() {
  delete scores[words[currentIdx].word];
  resetUI();
  buildTabs();
  updateStats();
}

function playModel() {
  if (modelAudio) { modelAudio.pause(); }
  var w = words[currentIdx];
  modelAudio = new Audio('audio/' + w.slug + '.mp3');
  var btn = document.getElementById('btnModel');
  btn.classList.add('playing');
  modelAudio.onended = function() { btn.classList.remove('playing'); };
  modelAudio.onerror = function() { btn.classList.remove('playing'); };
  modelAudio.play();
}

function playMyRecording() {
  if (!myBlobURL) return;
  var a = new Audio(myBlobURL);
  var btn = document.getElementById('btnPlay');
  btn.classList.add('playing');
  a.onended = function() { btn.classList.remove('playing'); };
  a.play();
}

function toggleRecord() {
  if (isRecording) {
    mediaRecorder.stop();
  } else {
    resetUI();
    recordedChunks = [];
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        stream.getTracks().forEach(function(t) { t.stop(); });
        myBlob = new Blob(recordedChunks, { type: mime });
        myBlobURL = URL.createObjectURL(myBlob);

        document.getElementById('playbackRow').classList.add('show');
        document.getElementById('recordHint').textContent = 'Analyzing...';
        analyzeRecording();
      };

      mediaRecorder.start();
      document.getElementById('btnRecord').classList.add('recording');
      document.getElementById('recordHint').textContent = 'Recording... Tap to stop';
      isRecording = true;

      setTimeout(function() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, 4000);
    }).catch(function() {
      document.getElementById('recordHint').textContent = 'Microphone blocked!';
    });
  }
}

function stopRecordUI() {
  isRecording = false;
  document.getElementById('btnRecord').classList.remove('recording');
}

// =========== Audio Analysis Engine ===========

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Load and decode an audio blob
function decodeBlob(blob) {
  return blob.arrayBuffer().then(function(buf) {
    return getAudioCtx().decodeAudioData(buf);
  });
}

// Extract audio features from an AudioBuffer
// Returns: { duration, rms, peakCount, zeroCrossRate, spectralCentroid, pitchEstimate, energyEnvelope }
function extractFeatures(buffer) {
  var data = buffer.getChannelData(0);
  var sampleRate = buffer.sampleRate;
  var len = data.length;
  var duration = len / sampleRate;

  // RMS (root mean square = loudness)
  var sumSq = 0;
  for (var i = 0; i < len; i++) sumSq += data[i] * data[i];
  var rms = Math.sqrt(sumSq / len);

  // Peak count (number of significant amplitude peaks = syllable/energy bursts)
  var peaks = 0;
  var threshold = rms * 1.5;
  var above = false;
  for (var i = 0; i < len; i++) {
    var abs = Math.abs(data[i]);
    if (abs > threshold && !above) { peaks++; above = true; }
    if (abs < rms * 0.5) above = false;
  }

  // Zero crossing rate (related to frequency content = clarity)
  var zcr = 0;
  for (var i = 1; i < len; i++) {
    if ((data[i] >= 0 && data[i-1] < 0) || (data[i] < 0 && data[i-1] >= 0)) zcr++;
  }
  zcr = zcr / len;

  // Spectral centroid (brightness/clarity of the sound)
  // Use FFT-like approximation via zero-crossing + RMS relationship
  var centroid = zcr * sampleRate / 2;

  // Pitch estimation (simplified autocorrelation)
  var pitch = estimatePitch(data, sampleRate);

  // Energy envelope (fluency) - measure smoothness of amplitude changes
  var windowSize = Math.floor(sampleRate * 0.02); // 20ms windows
  var envelope = [];
  for (var i = 0; i < len; i += windowSize) {
    var end = Math.min(i + windowSize, len);
    var winSum = 0;
    for (var j = i; j < end; j++) winSum += Math.abs(data[j]);
    envelope.push(winSum / (end - i));
  }
  var envVar = 0;
  if (envelope.length > 1) {
    var envMean = envelope.reduce(function(a,b){return a+b;},0) / envelope.length;
    for (var k = 0; k < envelope.length; k++) envVar += Math.pow(envelope[k] - envMean, 2);
    envVar = Math.sqrt(envVar / envelope.length) / (envMean || 0.001);
  }

  return {
    duration: duration,
    rms: rms,
    peaks: peaks,
    zcr: zcr,
    centroid: centroid,
    pitch: pitch,
    envVar: envVar,
    envelope: envelope,
    data: data
  };
}

// Simple pitch estimation via autocorrelation
function estimatePitch(data, sampleRate) {
  var len = data.length;
  var minLag = Math.floor(sampleRate / 400);  // ~400 Hz max
  var maxLag = Math.floor(sampleRate / 60);   // ~60 Hz min
  if (maxLag >= len) return 0;

  var bestCorr = -1, bestLag = 0;
  for (var lag = minLag; lag < maxLag; lag++) {
    var corr = 0;
    for (var i = 0; i < len - lag; i++) corr += data[i] * data[i + lag];
    if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
  }
  return bestLag > 0 ? sampleRate / bestLag : 0;
}

// Score a single dimension (0-100) based on how close student is to model
function dimScore(studentVal, modelVal, tolerance, invert) {
  if (!modelVal || modelVal === 0) return 70; // fallback
  var ratio = studentVal / modelVal;
  // Clamp to [1-tolerance, 1+tolerance] range gets full score
  if (ratio >= 1 - tolerance && ratio <= 1 + tolerance) return 100;
  if (ratio <= 0) return 10;
  var dist = Math.abs(Math.log(ratio)); // log scale
  var score = 100 - dist * (100 / (1 + tolerance));
  return Math.max(10, Math.min(100, Math.round(score)));
}

// Main analysis function
function analyzeRecording() {
  if (!myBlob) return;

  decodeBlob(myBlob).then(function(studentBuffer) {
    var studentFeat = extractFeatures(studentBuffer);

    // Draw waveform
    drawWaveform(studentFeat.data);

    // Get model features (lazy load + cache)
    var w = words[currentIdx];
    var modelPath = 'audio/' + w.slug + '.mp3';

    loadModelFeatures(modelPath).then(function(modelFeat) {
      if (!modelFeat) {
        // Model failed to load — use heuristic scoring
        showHeuristicScore(studentFeat);
        return;
      }

      // Compare student <-> model features
      var pitchScore = dimScore(studentFeat.pitch, modelFeat.pitch, 0.3, false);
      var volumeScore = dimScore(studentFeat.rms, modelFeat.rms, 0.4, false);
      var durRatio = studentFeat.duration / modelFeat.duration;
      var paceScore = durRatio >= 0.6 && durRatio <= 1.5 ? Math.round(100 - Math.abs(1 - durRatio) * 80) : Math.max(10, Math.round(50 - Math.abs(1 - durRatio) * 60));

      // Clarity: combine ZCR similarity and centroid similarity
      var zcrScore = dimScore(studentFeat.zcr, modelFeat.zcr, 0.25, false);
      var centroidScore = dimScore(studentFeat.centroid, modelFeat.centroid, 0.3, false);
      var clarityScore = Math.round(zcrScore * 0.5 + centroidScore * 0.5);

      // Fluency: compare envelope variance (lower is smoother)
      var fluScore = studentFeat.envVar < modelFeat.envVar * 1.5 ? 90 : Math.round(100 - Math.min(80, (studentFeat.envVar - modelFeat.envVar) * 40));

      // Overall
      var overall = Math.round(
        pitchScore * 0.2 + volumeScore * 0.15 + paceScore * 0.15 +
        clarityScore * 0.25 + fluScore * 0.25
      );

      displayScores(pitchScore, volumeScore, paceScore, clarityScore, fluScore, overall);
    }).catch(function() {
      showHeuristicScore(studentFeat);
    });
  }).catch(function() {
    document.getElementById('recordHint').textContent = 'Audio analysis failed. Try again.';
  });
}

// Load and cache model audio analysis
function loadModelFeatures(url) {
  if (modelProfiles[url]) return Promise.resolve(modelProfiles[url]);

  return fetch(url).then(function(r) { return r.arrayBuffer(); })
    .then(function(buf) { return getAudioCtx().decodeAudioData(buf); })
    .then(function(buffer) {
      var feat = extractFeatures(buffer);
      modelProfiles[url] = feat;
      return feat;
    });
}

// Heuristic scoring (when model unavailable)
function showHeuristicScore(feat) {
  var vol = Math.min(100, Math.round(feat.rms * 800));
  var clarity = Math.min(100, Math.round(feat.zcr * 8));
  var flu = Math.min(100, Math.round(100 - feat.envVar * 30));
  var overall = Math.round(vol * 0.3 + clarity * 0.4 + flu * 0.3);
  displayScores(70, vol, 70, clarity, flu, overall);
}

function displayScores(pitch, volume, pace, clarity, fluency, overall) {
  var panel = document.getElementById('scorePanel');
  panel.classList.add('show');

  setScore('scorePitch', pitch);
  setScore('scoreVolume', volume);
  setScore('scoreDuration', pace);
  setScore('scoreClarity', clarity);
  setScore('scoreFluency', fluency);
  setScore('scoreOverall', overall);

  var msg = document.getElementById('overallMsg');
  if (overall >= 90) {
    msg.innerHTML = '🏆 Excellent! 发音非常标准！';
    msg.style.background = '#D1FAE5'; msg.style.color = '#065F46';
  } else if (overall >= 75) {
    msg.innerHTML = '👍 Good job! 发音不错，再练练更完美！';
    msg.style.background = '#DBEAFE'; msg.style.color = '#1E40AF';
  } else if (overall >= 55) {
    msg.innerHTML = '📚 Not bad! 多听范读，注意模仿语调！';
    msg.style.background = '#FEF3C7'; msg.style.color = '#92400E';
  } else {
    msg.innerHTML = '💪 Keep practicing! 再听一遍范读，重新试试！';
    msg.style.background = '#FEE2E2'; msg.style.color = '#991B1B';
  }

  document.getElementById('recordHint').textContent = 'Tap to record again';

  var w = words[currentIdx];
  scores[w.word] = { overall: overall, attempts: (scores[w.word] ? scores[w.word].attempts + 1 : 1) };
  buildTabs();
  updateStats();
}

function setScore(id, val) {
  val = Math.max(10, Math.min(100, Math.round(val)));
  var el = document.getElementById(id);
  var item = el.closest('.score-item');
  item.classList.remove('bad', 'ok', 'good', 'great');
  if (val >= 90) item.classList.add('great');
  else if (val >= 70) item.classList.add('good');
  else if (val >= 45) item.classList.add('ok');
  else item.classList.add('bad');
  el.querySelector('.score-val').textContent = val + '%';
}

// Draw waveform on canvas
function drawWaveform(data) {
  var canvas = document.getElementById('waveCanvas');
  canvas.classList.add('show');
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Downsample
  var step = Math.max(1, Math.floor(data.length / w));
  ctx.beginPath();
  ctx.strokeStyle = '#2563EB';
  ctx.lineWidth = 1.5;
  var mid = h / 2;
  for (var i = 0; i < w; i++) {
    var idx = i * step;
    var val = Math.abs(data[Math.min(idx, data.length - 1)]);
    var y = mid - val * mid * 0.9;
    if (i === 0) ctx.moveTo(i, y || mid);
    else ctx.lineTo(i, y || mid);
  }
  ctx.stroke();

  // Zero line
  ctx.beginPath();
  ctx.strokeStyle = '#E2E8F0';
  ctx.lineWidth = 0.5;
  ctx.moveTo(0, mid); ctx.lineTo(w, mid);
  ctx.stroke();
}

function updateStats() {
  var done = 0, total = 0;
  for (var k in scores) {
    if (scores[k].attempts > 0) { done++; total += scores[k].overall; }
  }
  document.getElementById('doneCount').textContent = done;
  document.getElementById('avgScore').textContent = done > 0 ? Math.round(total / done) + '%' : '-';
}

renderWord();
</script>
</body>
</html>

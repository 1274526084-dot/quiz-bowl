<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>词汇配对 · ECRL</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#f8fafc;min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto}.header{text-align:center;margin-bottom:20px}.header .badge{display:inline-block;padding:4px 18px;border-radius:20px;background:#16a34a;color:#fff;font-size:12px;font-weight:700;letter-spacing:2px}.header h2{color:#1e293b;font-size:20px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{padding:18px 14px;border-radius:12px;text-align:center;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;border:2px solid #e2e8f0;background:#fff}.card:hover{border-color:#6366f1}.card.en{background:#eff6ff;color:#2563eb}.card.zh{background:#fef2f2;color:#dc2626}.card.sel{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.2)}.card.matched{background:#f0fdf4;color:#16a34a;border-color:#22c55e;pointer-events:none;opacity:0.8}.card.wrong{animation:shake 0.4s;border-color:#ef4444}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:#fff;padding:14px 16px;border-radius:12px;border:2px solid #e2e8f0}.score{font-size:28px;font-weight:900;color:#16a34a}.btn{padding:10px 24px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:#16a34a;color:#fff}.btn:active{transform:scale(0.95)}
.link-row{margin-top:16px;text-align:center}.link-row a{color:#64748b;font-size:12px;text-decoration:none}
</style></head><body><div class="container">
<div class="header"><div class="badge">VOCAB MATCH</div><h2>📝 词汇配对 · ECRL 乘务英语</h2></div>
<div class="score-bar"><span class="score" id="score">0/8</span><button class="btn" onclick="resetGame()">🔄 重新开始</button></div>
<div class="grid" id="grid"></div>
<div class="link-row"><a href="hub.html">← 返回任务中心</a></div>
</div>
<script>
var pairs=[{en:'attendant',zh:'乘务员'},{en:'carriage',zh:'车厢'},{en:'departure',zh:'出发'},{en:'passenger',zh:'乘客'},{en:'platform',zh:'站台'},{en:'reservation',zh:'预订'},{en:'luggage',zh:'行李'},{en:'timetable',zh:'时刻表'}];
var sel=null,matched=0;
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t;}return b;}
function build(){var h='';var ens=shuffle(pairs),zhs=shuffle(pairs);ens.forEach(function(p,i){h+='<div class="card en" id="en'+i+'" data-word="'+p.en+'" onclick="select(this,\'en\')">'+p.en+'</div>';});zhs.forEach(function(p,i){h+='<div class="card zh" id="zh'+i+'" data-word="'+p.en+'" onclick="select(this,\'zh\')">'+p.zh+'</div>';});document.getElementById('grid').innerHTML=h;}
function select(el,type){if(el.classList.contains('matched'))return;document.querySelectorAll('.card.sel').forEach(function(c){c.classList.remove('sel');if(c.dataset.word===el.dataset.word)return;});if(sel&&sel!==el&&sel.dataset.word===el.dataset.word&&((sel.classList.contains('en')&&el.classList.contains('zh'))||(sel.classList.contains('zh')&&el.classList.contains('en')))){sel.classList.add('matched');el.classList.add('matched');sel.classList.remove('sel');matched++;document.getElementById('score').textContent=matched+'/8';if(matched===8){setTimeout(function(){alert('🎉 全部配对成功！');},300);}sel=null;return;}document.querySelectorAll('.card.sel').forEach(function(c){c.classList.remove('sel');});el.classList.add('sel');sel=el;}
function resetGame(){matched=0;sel=null;document.getElementById('score').textContent='0/8';build();}
build();
</script></body></html>
